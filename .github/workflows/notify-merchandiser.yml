name: Notify — merchandiser reminder

on:
  schedule:
    # 08:00 UTC ≈ 11:00 AM Beirut in summer (UTC+3).
    # Same UTC/daylight-saving note as the other workflows — adjust as needed.
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: scripts
        run: npm install
      - name: Run notifier
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node notify.js merchandiser-reminder
