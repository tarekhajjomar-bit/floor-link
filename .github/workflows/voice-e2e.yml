name: Test — voice push (manual)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: scripts
        run: npm install firebase-admin google-auth-library
      - name: Inspect
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node voice-e2e.js
      - name: Save result
        if: always()
        run: |
          git config user.name "rules-bot"; git config user.email "rules@users.noreply.github.com"
          git checkout -B voicee2e-result
          git add -f diag/voice-e2e.txt && git commit -qm "Voice result" && git push -f origin voicee2e-result
