name: Cleanup — hidden expiry items (manual)

on:
  workflow_dispatch:
    inputs:
      dry:
        description: "1 = only count"
        default: "1"

permissions:
  contents: write

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: scripts
        run: npm install firebase-admin
      - name: Clean up
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY: ${{ github.event.inputs.dry }}
        run: node cleanup-deleted-items.js
      - name: Save result
        if: always()
        run: |
          git config user.name "rules-bot"; git config user.email "rules@users.noreply.github.com"
          git checkout -B cleanup-result
          git add -f diag/cleanup.txt && git commit -qm "Cleanup result" && git push -f origin cleanup-result
