name: Notify — test (manual only)

# No schedule on purpose — this one only runs when you click "Run workflow"
# below, from the Actions tab. It sends a test push to EVERY registered
# device, regardless of any real data, so you can verify the pipeline
# (service account → FCM → your phone) actually delivers.

on:
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: scripts
        run: npm install
      - name: Run notifier
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node notify.js test
