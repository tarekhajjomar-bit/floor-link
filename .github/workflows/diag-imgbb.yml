name: Diag — ImgBB upload check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Try a tiny upload with each key
        run: |
          mkdir -p diag
          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==' > /tmp/px.b64
          : > diag/imgbb.txt
          date -u >> diag/imgbb.txt
          for K in 65f47cfbdd68220add021626940dd010 65889477016756c13a167bb8606690cd; do
            echo "== key ${K:0:6}" >> diag/imgbb.txt
            curl -s -m 40 -w "\nHTTP %{http_code} time %{time_total}s\n" -X POST "https://api.imgbb.com/1/upload?key=$K&expiration=60" -F "image=@/tmp/px.b64" | cut -c1-400 >> diag/imgbb.txt
          done
          echo "== reachability" >> diag/imgbb.txt
          curl -s -o /dev/null -m 20 -w "api.imgbb.com %{http_code}\n" https://api.imgbb.com/ >> diag/imgbb.txt
          curl -s -o /dev/null -m 20 -w "i.ibb.co %{http_code}\n" https://i.ibb.co/ >> diag/imgbb.txt
      - name: Save result
        run: |
          git config user.name "diag-bot"; git config user.email "diag@users.noreply.github.com"
          git checkout -B diag-result
          git add diag/imgbb.txt && git commit -qm "ImgBB diag result" && git push -f origin diag-result
