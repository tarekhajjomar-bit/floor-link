name: Test — Firestore rules (manual)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install
        run: npm install && npm install -g firebase-tools
      - name: Run rules tests
        run: |
          mkdir -p diag
          firebase emulators:exec --only firestore --project floor-link-test "node test/rules.test.js" 2>&1 | tee diag/rules-test.txt
      - name: Save result
        if: always()
        run: |
          git config user.name "rules-bot"; git config user.email "rules@users.noreply.github.com"
          git checkout -B rulestest-result
          git add -f diag/rules-test.txt && git commit -qm "Rules test result" && git push -f origin rulestest-result
