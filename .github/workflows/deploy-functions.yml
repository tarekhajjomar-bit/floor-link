name: Deploy — Cloud Functions (manual)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          npm install -g firebase-tools
          cd functions && npm install --omit=dev
          cd ../scripts && npm install google-auth-library
      - name: Deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          mkdir -p diag
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          PROJECT=$(node -e "console.log(require('/tmp/sa.json').project_id)")
          # Cloud Functions must live next to the Firestore database
          REGION=$(cd scripts && node -e "
            const {GoogleAuth}=require('google-auth-library');
            (async()=>{const a=new GoogleAuth({credentials:require('/tmp/sa.json'),scopes:['https://www.googleapis.com/auth/cloud-platform']});
            const c=await a.getClient();const r=await c.request({url:'https://firestore.googleapis.com/v1/projects/$PROJECT/databases/(default)'});
            console.log(r.data.locationId);})().catch(e=>{console.log('us-central1');});")
          echo "project=$PROJECT firestore-location=$REGION" | tee diag/functions.txt
          case "$REGION" in nam5) REGION=us-central1;; eur3) REGION=europe-west1;; esac
          export FN_REGION=$REGION
          echo "functions region=$REGION" | tee -a diag/functions.txt
          firebase deploy --only functions --project "$PROJECT" --non-interactive --force 2>&1 | tee -a diag/functions.txt
      - name: Save result
        if: always()
        run: |
          git config user.name "rules-bot"; git config user.email "rules@users.noreply.github.com"
          git checkout -B functions-result
          git add -f diag/functions.txt && git commit -qm "Functions result" && git push -f origin functions-result
