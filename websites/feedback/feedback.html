<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>رأيك بيهمّنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* Layout: one narrow column (max 460px) under a brand header; each step is a single card-free stack.
   The page takes its whole look from the QR code's branch: Shoppies (red, cart mascot) or Al-Hajj Omar (sage, logo seal). */
:root{
  color-scheme:light;
  --bg:#F5F4F1; --card:#FFFFFF; --ink:#1F1E1C; --soft:#66625C; --line:#E2DFD8;
  --accent:#3F3D39; --accent-deep:#24231F; --accent-ink:#FFFFFF; --tint:#ECEAE5; --hi:#C9C4BA;
  --danger:#B3261E;
  --display:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --script:var(--display);
  --ease:cubic-bezier(.2,.8,.2,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-brand="shoppies"]{
  --bg:#FFF6EE; --card:#FFFFFF; --ink:#231B1B; --soft:#6E5D5A; --line:#F1D9CF;
  --accent:#E31E24; --accent-deep:#8E0E14; --accent-ink:#FFF6EE; --tint:#FDE8E2; --hi:#FFC93C;
  --display:"Bricolage Grotesque","Cairo",system-ui,sans-serif;
  --body:"Bricolage Grotesque","Cairo",system-ui,sans-serif;
  --script:"Pacifico","Lemonada",cursive;
}
:root[data-brand="shoppies"][lang="ar"]{
  --display:"Cairo",system-ui,sans-serif; --body:"Cairo",system-ui,sans-serif; --script:"Lemonada","Cairo",cursive;
}
:root[data-brand="omar"]{
  --bg:#FAFCF6; --card:#FFFFFF; --ink:#1E2A15; --soft:#56634B; --line:#D9E6CB;
  --accent:#5E8A45; --accent-deep:#3F5F2C; --accent-ink:#FAFCF6; --tint:#E6F2DA; --hi:#AAD489;
  --display:"El Messiri","Readex Pro",system-ui,sans-serif;
  --body:"Readex Pro","El Messiri",system-ui,sans-serif;
  --script:"El Messiri",serif;
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;overflow-x:clip;background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px;border-radius:12px}
h1,h2,p{margin:0}

.page{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:0 32px;display:flex;flex-direction:column;gap:22px}

/* ---------- header ---------- */
.hd{position:relative;margin-inline:-16px;padding:18px 20px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.lang{position:absolute;top:14px;inset-inline-end:14px;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;border:1.5px solid currentColor;background:transparent;font-family:"Cairo",system-ui,sans-serif}
html[lang="ar"] .lang{font-family:var(--body)}

:root[data-brand="shoppies"] .hd{background:var(--accent);color:var(--accent-ink);border-radius:0 0 32px 32px;padding-top:26px;overflow:hidden}
:root[data-brand="shoppies"] .lang{color:var(--accent-ink)}
.wm{display:block;width:min(64vw,210px);height:auto;fill:currentColor}
.wm .ch{fill:currentColor}
.hd-cart{width:74px;margin-top:-4px}
.hd-floor{position:absolute;left:0;right:0;bottom:12px;height:4px;opacity:.28;background:repeating-linear-gradient(90deg,var(--accent-ink) 0 26px,transparent 26px 42px);animation:floor 1.4s linear infinite}
html[dir="rtl"] .hd-floor{animation-direction:reverse}
@keyframes floor{to{background-position:-42px 0}}

:root[data-brand="omar"] .hd{color:var(--ink);padding-top:30px;border-bottom:1px solid var(--line)}
:root[data-brand="omar"] .lang{color:var(--accent-deep)}
.seal{width:92px;height:92px;border-radius:50%;background:var(--card);box-shadow:0 0 0 6px var(--tint),0 10px 28px -14px rgba(30,42,21,.5);display:grid;place-items:center;overflow:hidden;animation:sealIn .9s var(--ease) both}
.seal img{width:84%;height:84%;object-fit:contain}
@keyframes sealIn{from{transform:scale(.7) rotate(-14deg);opacity:0}}
.omar-name{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.3}
.omar-since{font-size:12px;letter-spacing:.14em;color:var(--soft)}

.plain-hd{padding-top:30px}

/* ---------- headings ---------- */
.intro{display:flex;flex-direction:column;gap:4px;text-align:center}
.intro h1{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.25;text-wrap:balance}
:root[data-brand="omar"] .intro h1{font-weight:700}
.intro p{color:var(--soft);font-size:15px}
.tag{align-self:center;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--tint);color:var(--accent-deep);margin-bottom:6px}
.tag svg{width:15px;height:15px}

/* ---------- in store / delivery ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:5px;border-radius:20px;background:var(--tint)}
.seg-b{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:15px;padding:12px 8px;background:transparent;font-weight:800;font-size:16px;color:var(--accent-deep);transition:background .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease)}
.seg-b svg{width:20px;height:20px;flex:none}
.seg-b[aria-checked="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 18px -12px var(--accent)}

/* ---------- choice ---------- */
.choices{display:grid;gap:12px}
.choice{display:flex;align-items:center;gap:14px;text-align:start;width:100%;padding:18px;border-radius:22px;border:2px solid var(--line);background:var(--card);transition:transform .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease)}
.choice:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 12px 26px -18px var(--accent)}
.choice:active{transform:scale(.98)}
.choice .ico{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--tint);color:var(--accent)}
.choice .ico svg{width:28px;height:28px}
.choice b{display:block;font-family:var(--display);font-size:18px;line-height:1.3}
.choice span{display:block;color:var(--soft);font-size:14px}
.choice .go{margin-inline-start:auto;flex:none;width:22px;height:22px;color:var(--soft)}
html[dir="rtl"] .choice .go{transform:scaleX(-1)}

/* ---------- form blocks ---------- */
.step{display:flex;flex-direction:column;gap:20px;animation:rise .35s var(--ease) both}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--soft);font-weight:700;padding:4px 0;font-size:14px}
.back svg{width:18px;height:18px}
html[dir="rtl"] .back svg{transform:scaleX(-1)}
.block{display:flex;flex-direction:column;gap:10px}
.label{font-family:var(--display);font-weight:700;font-size:17px}
.hint{font-size:13px;color:var(--soft)}

.stars{display:flex;justify-content:center;gap:6px;direction:ltr}
.star{border:0;background:none;padding:4px;color:var(--line);transition:transform .15s var(--ease)}
.star svg{width:46px;height:46px;display:block}
.star.on{color:var(--hi)}
:root[data-brand="omar"] .star.on{color:var(--accent)}
.star.pop{animation:pop .35s var(--ease)}
@keyframes pop{40%{transform:scale(1.28) rotate(-8deg)}}
.star-word{text-align:center;font-weight:700;min-height:1.6em;color:var(--accent-deep)}

.q{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:0}
.q-name{font-weight:600;min-width:0}
.chips{display:flex;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:700;color:var(--soft);transition:background .15s,border-color .15s,color .15s}
.chip[aria-pressed="true"][data-v="good"]{background:#E3F1E1;border-color:#3E7D4C;color:#2E6A3B}
.chip[aria-pressed="true"][data-v="ok"]{background:#FBF0D6;border-color:#B8791A;color:#8A5A10}
.chip[aria-pressed="true"][data-v="bad"]{background:#FBE3DE;border-color:var(--danger);color:var(--danger)}

textarea,input[type="text"],input[type="tel"]{width:100%;border:1.5px solid var(--line);border-radius:16px;background:var(--card);padding:12px 14px;font-size:16px;transition:border-color .15s,box-shadow .15s}
textarea{min-height:110px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--tint)}

.toggle{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--tint);font-weight:700}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.contact{display:flex;flex-direction:column;gap:10px}

.err{color:var(--danger);font-size:14px;font-weight:600;text-align:center}

.btn{position:relative;isolation:isolate;overflow:hidden;border:0;border-radius:999px;padding:15px 22px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:17px;width:100%;transition:transform .12s var(--ease),opacity .15s}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--accent-deep);transform:translateY(101%);transition:transform .45s var(--ease)}
.btn:hover::before,.btn:active::before{transform:translateY(0)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.6;cursor:default}
:root[data-brand="omar"] .btn{border-radius:16px}

/* ---------- done / messages ---------- */
.done{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding-top:10px}
.done h1{font-family:var(--script);font-weight:400;font-size:34px;line-height:1.35;color:var(--accent)}
:root[data-brand="omar"] .done h1{font-weight:700}
.done p{color:var(--soft);max-width:32ch}
.run{width:100%;height:96px;position:relative;overflow:hidden;color:var(--accent)}
.run .cart{position:absolute;bottom:4px;width:96px;inset-inline-start:-110px;animation:runby 2.6s var(--ease) .2s forwards}
html[dir="rtl"] .run .cart{transform:scaleX(-1)}
@keyframes runby{to{inset-inline-start:calc(50% - 48px)}}
.check{width:84px;height:84px;border-radius:50%;background:var(--tint);color:var(--accent);display:grid;place-items:center}
.check svg{width:44px;height:44px;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .6s var(--ease) .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.link{color:var(--accent-deep);font-weight:700}

.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}

.foot{text-align:center;font-size:12px;color:var(--soft);letter-spacing:.04em}

/* ---------- cart mascot (from the Shoppies site) ---------- */
.cart{overflow:visible;--slot:var(--accent);color:inherit;width:100%;height:auto;display:block}
.cart .slots{fill:var(--slot)}
.cart .leg{transform-box:view-box}
.cart .leg-a{transform-origin:160px 168px;animation:legA .3s ease-in-out infinite alternate}
.cart .leg-b{transform-origin:248px 156px;animation:legB .3s ease-in-out infinite alternate}
.cart .cart-body{transform-box:view-box;transform-origin:200px 160px;animation:bob .15s ease-in-out infinite alternate}
@keyframes legA{from{transform:rotate(13deg)}to{transform:rotate(-11deg)}}
@keyframes legB{from{transform:rotate(-11deg)}to{transform:rotate(13deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-9px) rotate(-1.5deg)}}
.run .cart{--slot:var(--bg)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .run .cart{inset-inline-start:calc(50% - 48px)}
}
</style>

  busy: false, err: "", sentKind: null, sentWants: false
};
try{ var l = localStorage.getItem("fb_lang"); if(l === "ar" || l === "en") S.lang = l; }catch(e){}

var db = null, auth = null, authReady = null;

function t(k){ return T[S.lang][k]; }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function setLang(l){
  S.lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  document.title = t("title");
  try{ localStorage.setItem("fb_lang", l); }catch(e){}
}

function setBrand(b){
  S.brand = b;
  document.documentElement.setAttribute("data-brand", b);
  var meta = document.querySelector('meta[name="theme-color"]') || document.head.appendChild(Object.assign(document.createElement("meta"), {name:"theme-color"}));
  meta.content = b === "shoppies" ? "#E31E24" : "#FAFCF6";
  if(!document.getElementById("brandFonts")){
    var link = document.createElement("link");
    link.id = "brandFonts"; link.rel = "stylesheet"; link.href = FONTS[b];
    document.head.appendChild(link);
  }
}

/* ---------- pieces ---------- */
function wordmark(){
  var paths = '<path class="ch" d="'+LOGO.S+'"/><path class="ch" d="'+LOGO.body+'"/><path class="ch" d="'+LOGO.dot+'"/>';
  if(S.lang === "ar") paths += '<path class="ch" d="'+LOGO.sub+'"/>';
  return '<svg class="wm" viewBox="0 0 940 280" role="img" aria-label="Shoppies">'+paths+'</svg>';
}

function header(){
  var langBtn = '<button type="button" class="lang" data-act="lang">'+(S.lang === "ar" ? "English" : "عربي")+'</button>';
  if(S.brand === "shoppies"){
    return '<header class="hd">'+langBtn+wordmark()+'<div class="hd-cart">'+MASCOT+'</div><div class="hd-floor"></div></header>';
  }
  if(S.brand === "omar"){
    return '<header class="hd">'+langBtn+'<div class="seal"><img src="'+OMAR_LOGO+'" alt=""></div>'+
      '<div class="omar-name">'+esc(t("omarName"))+'</div><div class="omar-since">'+esc(t("since"))+'</div></header>';
  }
  return '<header class="hd plain-hd">'+langBtn+'</header>';
}

function demoNote(){ return demo ? '<p class="hint" style="text-align:center">'+esc(t("demo"))+'</p>' : ''; }
function errLine(){ return S.err ? '<p class="err" role="alert">'+esc(S.err)+'</p>' : ''; }
function backBtn(){ return '<button type="button" class="back" data-act="home">'+ICON.backArrow+esc(t("back"))+'</button>'; }

function screenHome(){
  var tag = "", how = "";
  if(S.codeType === "any"){
    how = '<div class="block"><div class="label" style="text-align:center">'+esc(t("how"))+'</div><div class="seg" role="radiogroup" aria-label="'+esc(t("how"))+'">' +
      ["store","delivery"].map(function(v){
        return '<button type="button" class="seg-b" role="radio" data-act="how" data-v="'+v+'" aria-checked="'+(S.type === v)+'">'+(v === "store" ? ICON.shop : ICON.truck)+esc(t("how_"+v))+'</button>';
      }).join("") + '</div></div>';
  } else {
    tag = '<span class="tag">'+(S.type === "store" ? ICON.shop : ICON.truck)+esc(S.type === "store" ? t("about_store") : t("about_delivery"))+'</span>';
  }
  return '<div class="step">' +
    '<div class="intro">'+tag+'<h1>'+esc(t("title"))+'</h1><p>'+esc(t("sub"))+'</p></div>' + how + errLine() +
    '<div class="choices">' +
      '<button type="button" class="choice" data-act="review"><span class="ico">'+ICON.star+'</span><span><b>'+esc(t("c_review"))+'</b><span>'+esc(t("c_review_s"))+'</span></span><span class="go">'+ICON.arrow+'</span></button>' +
      '<button type="button" class="choice" data-act="complaint"><span class="ico">'+ICON.chat+'</span><span><b>'+esc(t("c_complaint"))+'</b><span>'+esc(t("c_complaint_s"))+'</span></span><span class="go">'+ICON.arrow+'</span></button>' +
    '</div>' + demoNote() +
  '</div>';
}

function screenReview(){
  var stars = "";
  for(var i = 1; i <= 5; i++){
    stars += '<button type="button" class="star'+(i <= S.stars ? " on" : "")+'" data-act="star" data-n="'+i+'" role="radio" aria-checked="'+(i === S.stars)+'" aria-label="'+i+" "+esc(t("starAria"))+'">'+ICON.star+'</button>';
  }
  var qs = QS[S.type].map(function(k){
    var cur = S.answers[k];
    var chips = ["good","ok","bad"].map(function(v){
      return '<button type="button" class="chip" data-act="ans" data-k="'+k+'" data-v="'+v+'" aria-pressed="'+(cur === v)+'">'+esc(t(v))+'</button>';
    }).join("");
    return '<div class="q"><span class="q-name">'+esc(t("q_"+k))+'</span><div class="chips">'+chips+'</div></div>';
  }).join("");
  return '<form class="step" id="f" novalidate>' + backBtn() +
    '<div class="block"><div class="label" style="text-align:center">'+esc(t("howHappy"))+'</div>' +
      '<div class="stars" role="radiogroup" aria-label="'+esc(t("howHappy"))+'">'+stars+'</div>' +
      '<div class="star-word" id="starWord">'+(S.stars ? esc(t("starWords")[S.stars-1]) : "")+'</div></div>' +
    '<div class="block"><div class="label">'+esc(t("quick"))+'</div><div class="hint">'+esc(t("quickHint"))+'</div><div>'+qs+'</div></div>' +
    '<div class="block"><label class="label" for="txt">'+esc(t("more"))+'</label>' +
      '<textarea id="txt" maxlength="1000" placeholder="'+esc(t("morePh"))+'">'+esc(S.text)+'</textarea></div>' +
    errLine() +
    '<button type="submit" class="btn"'+(S.busy ? " disabled" : "")+'>'+esc(S.busy ? t("sending") : t("sendReview"))+'</button>' + demoNote() +
  '</form>';
}

function screenComplaint(){
  return '<form class="step" id="f" novalidate>' + backBtn() +
    '<div class="block"><label class="label" for="txt">'+esc(t("cTitle"))+'</label>' +
      '<textarea id="txt" maxlength="1000" placeholder="'+esc(t("cPh"))+'">'+esc(S.text)+'</textarea></div>' +
    '<label class="toggle" for="wants"><input type="checkbox" id="wants"'+(S.wants ? " checked" : "")+'>'+esc(t("wants"))+'</label>' +
    '<div class="contact" id="contactBox"'+(S.wants ? "" : " hidden")+'>' +
      '<input type="text" id="cname" maxlength="80" autocomplete="name" placeholder="'+esc(t("name"))+'" value="'+esc(S.cname)+'">' +
      '<input type="tel" id="cinfo" maxlength="80" autocomplete="tel" placeholder="'+esc(t("contact"))+'" value="'+esc(S.cinfo)+'">' +
    '</div>' +
    errLine() +
    '<button type="submit" class="btn"'+(S.busy ? " disabled" : "")+'>'+esc(S.busy ? t("sending") : t("sendComplaint"))+'</button>' + demoNote() +
  '</form>';
}

function screenThanks(){
  var isC = S.sentKind === "complaint";
  var art = S.brand === "shoppies" ? '<div class="run">'+MASCOT+'</div>' : '<div class="check">'+ICON.check+'</div>';
  var visit = S.brand === "shoppies" && !demo ? '<a class="link" href="/">'+esc(t("visit"))+'</a>' : '';
  return '<div class="step done">' + art +
    '<h1>'+esc(isC ? t("thanksC") : t("thanksR"))+'</h1>' +
    '<p>'+esc(isC ? (S.sentWants ? t("thanksCs1") : t("thanksCs0")) : t("thanksRs"))+'</p>' + visit + demoNote() +
  '</div>';
}

function screenMsg(titleKey, subKey, retry){
  return '<div class="step done"><div class="intro"><h1>'+esc(t(titleKey))+'</h1><p>'+esc(t(subKey))+'</p></div>' +
    (retry ? '<button type="button" class="btn" data-act="reload">'+esc(t("retry"))+'</button>' : '') + '</div>';
}

function render(){
  var body;
  switch(S.screen){
    case "loading": body = '<div class="spin" aria-label="Loading"></div>'; break;
    case "home": body = screenHome(); break;
    case "review": body = screenReview(); break;
    case "complaint": body = screenComplaint(); break;
    case "thanks": body = screenThanks(); break;
    case "nocode": body = screenMsg("noCodeT", "noCodeS"); break;
    case "off": body = screenMsg("offT", "offS"); break;
    default: body = screenMsg("loadErr", "net", true);
  }
  document.getElementById("app").innerHTML = header() + body;
  wire();
}

function wire(){
  var f = document.getElementById("f");
  if(f){
    f.addEventListener("submit", function(e){ e.preventDefault(); submit(); });
    var txt = document.getElementById("txt");
    if(txt) txt.addEventListener("input", function(){ S.text = this.value; });
    var w = document.getElementById("wants");
    if(w) w.addEventListener("change", function(){
      S.wants = this.checked;
      document.getElementById("contactBox").hidden = !S.wants;
      if(S.wants) document.getElementById("cinfo").focus();
    });
    var cn = document.getElementById("cname"); if(cn) cn.addEventListener("input", function(){ S.cname = this.value; });
    var ci = document.getElementById("cinfo"); if(ci) ci.addEventListener("input", function(){ S.cinfo = this.value; });
  }
}

document.getElementById("app").addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if(!el) return;
  var act = el.getAttribute("data-act");
  if(act === "lang"){ setLang(S.lang === "ar" ? "en" : "ar"); render(); return; }
  if(act === "reload"){ location.reload(); return; }
  if(act === "home"){ S.screen = "home"; S.err = ""; render(); scrollTo(0,0); return; }
  if(act === "how"){
    S.type = el.getAttribute("data-v"); S.answers = {}; S.err = ""; render(); return;
  }
  if(act === "review" || act === "complaint"){
    if(S.codeType === "any" && !S.type){ S.err = t("needHow"); render(); return; }
    S.kind = act; S.screen = act; S.err = ""; S.text = "";
    render(); scrollTo(0,0); return;
  }
  if(act === "star"){
    S.stars = +el.getAttribute("data-n"); S.err = "";
    Array.prototype.forEach.call(document.querySelectorAll(".star"), function(b, i){
      b.classList.toggle("on", i < S.stars);
      b.setAttribute("aria-checked", String(i + 1 === S.stars));
    });
    el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
    document.getElementById("starWord").textContent = t("starWords")[S.stars - 1];
    var er = document.querySelector(".err"); if(er) er.remove();
    return;
  }
  if(act === "ans"){
    var k = el.getAttribute("data-k"), v = el.getAttribute("data-v");
    S.answers[k] = S.answers[k] === v ? undefined : v;
    Array.prototype.forEach.call(document.querySelectorAll('.chip[data-k="'+k+'"]'), function(c){
      c.setAttribute("aria-pressed", String(S.answers[k] === c.getAttribute("data-v")));
    });
    return;
  }
});

/* ---------- sending ---------- */
function fail(msg){ S.busy = false; S.err = msg; render(); var er = document.querySelector(".err"); if(er) er.scrollIntoView({block:"center"}); }

function submit(){
  if(S.busy) return;
  var text = S.text.trim().slice(0, 1000);
  if(S.kind === "review" && !S.stars) return fail(t("needStars"));
  if(S.kind === "complaint" && text.length < 2) return fail(t("needText"));
  if(S.kind === "complaint" && S.wants && S.cinfo.trim().length < 3) return fail(t("needContact"));
  S.busy = true; S.err = ""; render();

  if(demo){
    setTimeout(function(){ done(); }, 700);
    return;
  }

  var FV = firebase.firestore.FieldValue;
  authReady.then(function(user){
    var uid = user.uid;
    var rateRef = db.doc("feedback_rate/" + uid);
    return rateRef.get().then(function(snap){
      var TS = FV.serverTimestamp(), now = Date.now(), rate;
      if(!snap.exists){
        rate = {lastAt:TS, windowStart:TS, n:1};
      } else {
        var d = snap.data();
        var last = d.lastAt && d.lastAt.toMillis ? d.lastAt.toMillis() : 0;
        var ws = d.windowStart && d.windowStart.toMillis ? d.windowStart.toMillis() : 0;
        if(now - last < 60000) throw {code:"fb/wait"};
        if(now - ws < 86400000){
          if((d.n || 0) >= 5) throw {code:"fb/daily"};
          rate = {lastAt:TS, windowStart:d.windowStart, n:(d.n || 0) + 1};
        } else {
          rate = {lastAt:TS, windowStart:TS, n:1};
        }
      }
      var doc = {codeId:codeId, branch:S.branch, type:S.type, kind:S.kind, text:text, lang:S.lang, uid:uid, handled:false, createdAt:TS};
      if(S.kind === "review"){
        var ans = {};
        QS[S.type].forEach(function(k){ if(S.answers[k]) ans[k] = S.answers[k]; });
        doc.stars = S.stars; doc.answers = ans;
      } else {
        doc.wantsContact = !!S.wants;
        if(S.wants){ doc.contactName = S.cname.trim().slice(0, 80); doc.contactInfo = S.cinfo.trim().slice(0, 80); }
      }
      var batch = db.batch();
      batch.set(rateRef, rate);
      batch.set(db.collection("feedback").doc(), doc);
      return batch.commit();
    });
  }).then(done).catch(function(err){
    var c = err && err.code;
    if(c === "fb/wait") return fail(t("wait"));
    if(c === "fb/daily") return fail(t("daily"));
    if(c === "permission-denied") return fail(t("wait"));
    fail(t("net"));
  });
}

function done(){
  S.busy = false; S.sentKind = S.kind; S.sentWants = S.kind === "complaint" && S.wants;
  S.screen = "thanks"; if(S.codeType === "any") S.type = null; S.stars = 0; S.answers = {}; S.text = ""; S.wants = false; S.cname = ""; S.cinfo = "";
  render(); scrollTo(0,0);
}

/* ---------- start ---------- */
function start(){
  setLang(S.lang);
  if(demo){
    var h = (location.hash || "").slice(1).split("-");
    var b = h[0] === "omar" || h[0] === "shoppies" ? h[0] : (demo === "omar" ? "omar" : "shoppies");
    document.getElementById("brandFonts") && document.getElementById("brandFonts").remove();
    setBrand(b);
    var dt = h[1] || P.get("t") || "any";
    S.codeType = dt === "store" || dt === "delivery" ? dt : "any";
    S.branch = b; S.type = S.codeType === "any" ? null : S.codeType;
    S.screen = "home"; S.err = ""; render(); return;
  }
  if(!/^[A-Za-z0-9_-]{1,40}$/.test(codeId)){ S.screen = "nocode"; render(); return; }
  render();
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    auth = firebase.auth();
  }catch(e){ S.screen = "error"; render(); return; }

  authReady = new Promise(function(resolve, reject){
    var off = auth.onAuthStateChanged(function(u){
      off();
      if(u && u.isAnonymous) return resolve(u);
      auth.signInAnonymously().then(function(r){ resolve(r.user); }).catch(reject);
    });
  });
  authReady.catch(function(){});

  db.doc("feedback_codes/" + codeId).get().then(function(snap){
    var d = snap.exists ? snap.data() : null;
    if(!d || d.active !== true){ S.screen = "off"; render(); return; }
    S.branch = d.branch;
    S.codeType = d.type === "store" || d.type === "any" ? d.type : "delivery";
    S.type = S.codeType === "any" ? null : S.codeType;
    setBrand(d.branch === "shoppies" ? "shoppies" : "omar");
    S.screen = "home"; render();
  }).catch(function(){ S.screen = "error"; render(); });
}
start();
if(demo) window.addEventListener("hashchange", start);
})();
</script>
</body>
</html>
