<style>
:root{
  --red:#E31E24;--red-deep:#B5121B;--red-ink:#8E0E14;--cream:#FFF6EE;--char:#231B1B;--yellow:#FFC93C;
  --paper:#FFF6EE;--card:#fff;--ink:#231B1B;--muted:rgba(35,27,27,.62);--line:rgba(227,30,36,.16);--soft:#FFF9F4;
  --font:"Segoe UI","Tahoma","Noto Sans Arabic","Geeza Pro",Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:10px}
h2,h3{margin:0;font-weight:800}
h2{font-size:20px}h3{font-size:16px}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.sky{position:relative;overflow:hidden;isolation:isolate;color:var(--cream);padding:20px clamp(16px,4vw,40px) 30px;
  background:linear-gradient(180deg,#EC2A30 0%,#E31E24 55%,#D41A20 100%)}
.sky::before{content:"";position:absolute;inset:0;z-index:-2;opacity:0;transition:opacity 1.1s ease;
  background:linear-gradient(180deg,#3B1C1D 0%,#2A1E1E 55%,#1F1717 100%)}
body[data-shift=pm] .sky::before{opacity:1}
.orb{position:absolute;border-radius:50%;z-index:-1;transition:transform 1.1s cubic-bezier(.6,0,.2,1),opacity 1.1s ease;inset-inline-end:30%;top:-34px}
.sun{width:170px;height:170px;background:radial-gradient(circle at 45% 45%,#FFE89A 0%,var(--yellow) 55%,rgba(255,201,60,0) 72%);animation:rise 1.5s var(--ease) backwards}
.moon{width:96px;height:96px;top:14px;opacity:0;transform:translateY(190px);background:radial-gradient(circle at 38% 38%,#fff,#F2E6DC 60%,#D9C9BC);box-shadow:0 0 60px 10px rgba(255,240,225,.18)}
body[data-shift=pm] .sun{transform:translateY(220px);opacity:0}
body[data-shift=pm] .moon{transform:none;opacity:1}
@keyframes rise{from{transform:translateY(130px);opacity:0}}
.stars span{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--cream);opacity:0;transition:opacity 1.3s ease;z-index:-1}
body[data-shift=pm] .stars span{opacity:.7}
.sky-in{max-width:1240px;margin:0 auto;position:relative}
.sky-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.logo-svg{display:block;width:clamp(150px,18vw,210px);height:auto;fill:var(--cream);fill-rule:evenodd}
.brand-sub{font-size:13px;font-weight:600;opacity:.88}
.top-actions{display:flex;gap:10px;align-items:center}
.lang-btn{height:46px;min-width:58px;padding:0 14px;border-radius:999px;border:0;font-weight:800;color:var(--cream);background:none;box-shadow:inset 0 0 0 2px rgba(255,246,238,.7);cursor:pointer;transition:background .3s,color .3s}
.lang-btn:hover{background:var(--cream);color:var(--red)}
body[data-shift=pm] .lang-btn:hover{color:var(--char)}
.today{margin-top:26px;padding-inline-end:clamp(110px,16vw,190px)}
.today-day{font-size:clamp(44px,8vw,82px);font-weight:900;line-height:1}
.today-date{font-size:18px;opacity:.94;display:flex;gap:14px;align-items:center;margin-top:10px;flex-wrap:wrap}
.clock{padding:2px 12px;border-radius:999px;background:rgba(255,246,238,.16);font-size:15px;font-variant-numeric:tabular-nums}

.shift-switch{position:relative;display:flex;padding:4px;border-radius:999px;background:rgba(255,246,238,.14);box-shadow:inset 0 0 0 1.5px rgba(255,246,238,.35)}
.shift-switch button{position:relative;z-index:1;flex:1;min-width:104px;border:0;background:none;color:var(--cream);font-weight:800;padding:10px 18px;border-radius:999px;cursor:pointer;transition:color .45s;white-space:nowrap}
.shift-switch button[aria-checked=true]{color:var(--red)}
body[data-shift=pm] .shift-switch button[aria-checked=true]{color:var(--char)}
.thumb{position:absolute;top:4px;bottom:4px;inset-inline-start:4px;width:calc(50% - 4px);border-radius:999px;background:var(--cream);transition:transform .55s cubic-bezier(.6,0,.2,1)}
[dir=rtl] body[data-shift=pm] .thumb{transform:translateX(-100%)}
[dir=ltr] body[data-shift=pm] .thumb{transform:translateX(100%)}

/* running cart mascot */
.runner{position:absolute;inset-inline-end:0;bottom:-34px;width:clamp(100px,13vw,160px);color:var(--cream)}
.cart{display:block;overflow:visible;width:100%;height:auto;animation:cartIn 1.3s var(--ease) backwards}
[dir=ltr] .cart{transform:scaleX(-1)}
@keyframes cartIn{from{opacity:0;translate:60px 0}}
[dir=rtl] .cart{animation-name:cartInR}
@keyframes cartInR{from{opacity:0;translate:-60px 0}}
.cart .leg{transform-box:view-box}
.cart .leg-a{transform-origin:160px 168px;animation:legA .3s ease-in-out infinite alternate}
.cart .leg-b{transform-origin:248px 156px;animation:legB .3s ease-in-out infinite alternate}
.cart .cart-body{transform-box:view-box;transform-origin:200px 160px;animation:bob .15s ease-in-out infinite alternate}
.runner:not(.run) .leg,.runner:not(.run) .cart-body{animation-play-state:paused}
@keyframes legA{from{transform:rotate(13deg)}to{transform:rotate(-11deg)}}
@keyframes legB{from{transform:rotate(-11deg)}to{transform:rotate(13deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-9px) rotate(-1.5deg)}}
.runner.run{animation:dash 1.3s var(--ease)}
@keyframes dash{30%{translate:-14px 0}60%{translate:6px 0}}

/* shop awning edge */
.awning{position:relative;height:18px;margin-top:-1px;isolation:isolate;
  background:radial-gradient(circle at 50% 0,#D41A20 13px,transparent 13.5px) 0 0/28px 18px repeat-x}
.awning::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease;
  background:radial-gradient(circle at 50% 0,#1F1717 13px,transparent 13.5px) 0 0/28px 18px repeat-x}
body[data-shift=pm] .awning::before{opacity:1}

/* ---------- tabs ---------- */
.tabs{position:relative;z-index:3;display:flex;gap:4px;width:max-content;max-width:calc(100% - 24px);margin:10px auto 0;padding:6px;background:var(--card);border-radius:999px;box-shadow:0 0 0 1px var(--line),0 14px 30px -18px rgba(142,14,20,.5);overflow-x:auto}
.tabs button{border:0;background:none;font-weight:800;color:var(--ink);padding:10px 22px;border-radius:999px;cursor:pointer;transition:background .25s,color .25s;white-space:nowrap}
.tabs button:hover{background:var(--soft);color:var(--red)}
.tabs button.on{background:var(--red);color:var(--cream)}

main{max-width:1240px;margin:0 auto;padding:22px clamp(12px,3vw,32px) 70px}
.view{display:none}
.view.on{display:block;animation:viewIn .35s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:22px}
.muted{color:var(--muted)}
.banner{border-radius:16px;padding:14px 18px;margin-bottom:16px;background:#FFF0C7;color:#5A3A00;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.err{background:#FDE1DF;color:var(--red-ink)}

/* ---------- controls ---------- */
input,select{font:inherit;color:var(--ink);background:var(--soft);border:1.5px solid rgba(35,27,27,.14);border-radius:12px;padding:11px 14px;width:100%;transition:border-color .2s,background .2s,box-shadow .2s}
input:focus,select:focus{outline:none;border-color:var(--red);background:#fff;box-shadow:0 0 0 4px rgba(227,30,36,.13)}
.primary{position:relative;isolation:isolate;overflow:hidden;border:0;font-weight:800;background:var(--red);color:var(--cream);padding:13px 24px;border-radius:999px;cursor:pointer;transition:transform .15s}
.primary::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--char);border-radius:inherit;transform:translateY(101%);transition:transform .45s var(--ease)}
.primary:hover::before{transform:none}
.primary:active{transform:scale(.97)}
.primary.danger{background:var(--red-ink)}
.ghost-btn{border:1.5px solid rgba(35,27,27,.16);background:#fff;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer;transition:border-color .2s,color .2s}
.ghost-btn:hover{border-color:var(--red);color:var(--red)}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(35,27,27,.16);background:#fff;font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:border-color .2s,color .2s}
.icon-btn:hover:not(:disabled){border-color:var(--red);color:var(--red)}
.icon-btn:disabled{opacity:.3;cursor:default}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--soft);border:1.5px solid var(--line)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--char);color:var(--cream)}

/* ---------- shift view ---------- */
.daybar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px}
.daybar-title{display:flex;flex-direction:column;line-height:1.3;min-width:190px}
.daybar-title strong{font-size:18px}
.daybar-title span{font-size:13px;color:var(--muted)}
.staff{margin-inline-start:auto;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.staff input{width:170px;padding:9px 12px}
.shift-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;margin:16px 0}
.entry h2{margin-bottom:16px}
.field{display:block;margin-bottom:14px}
.lbl{display:block;font-size:13px;font-weight:800;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid rgba(35,27,27,.16);background:#fff;border-radius:999px;padding:9px 16px;font-weight:800;cursor:pointer;display:inline-flex;gap:8px;align-items:center;transition:background .2s,border-color .2s,color .2s,transform .15s}
.chip:hover{border-color:var(--red)}
.chip:active{transform:scale(.96)}
.chip .k{font-size:11px;font-weight:700;color:var(--muted);border:1px solid rgba(35,27,27,.18);border-radius:6px;padding:0 6px;line-height:1.5}
.chip.on{background:var(--red);border-color:var(--red);color:var(--cream)}
.chip.on .k{color:var(--cream);border-color:rgba(255,246,238,.5)}
.money-in{position:relative;display:block}
.money-in input{padding-right:64px;font-size:20px;font-weight:800;text-align:left}
.money-in span{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:800}
.form-actions{display:flex;gap:10px;align-items:center}
.form-actions .primary{flex:1}
.hint{font-size:13px;color:var(--muted);margin:12px 0 0}
.empty-drivers{background:var(--soft);border:1.5px dashed var(--line);border-radius:14px;padding:14px;font-size:14px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.sum-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.day-total{text-align:end}
.day-total span{display:block;font-size:13px;color:var(--muted);font-weight:700}
.day-total b{font-size:36px;font-weight:900;line-height:1.15;color:var(--red)}
.day-total small{display:block;color:var(--muted)}
.shift-block{border-radius:18px;padding:14px 16px;background:var(--soft);border:1.5px solid transparent;margin-top:14px;transition:border-color .4s}
.shift-block.cur.am{border-color:var(--yellow)}
.shift-block.cur.pm{border-color:var(--char)}
.sb-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sb-name{font-weight:900}
.sb-staff{font-size:13px;color:var(--muted)}
.sb-total{margin-inline-start:auto;font-size:20px;font-weight:900}
.drow{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.drow:last-of-type{border-bottom:0}
.drow .c{font-size:13px;color:var(--muted)}
.drow b{min-width:70px;text-align:end}
.sb-empty{font-size:13px;color:var(--muted);padding:8px 0 2px}
.sb-foot{display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px}
.sb-foot .primary{padding:9px 18px}
.sync{font-size:12.5px;font-weight:700;margin-inline-end:auto}
.sync.ok{color:#1E8A4F}.sync.pend{color:#8A5A00}

.table-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:start;font-size:13px;color:var(--muted);font-weight:800;padding:10px 12px;border-bottom:1.5px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid rgba(227,30,36,.08);vertical-align:middle}
tbody tr:hover td{background:var(--soft)}
tr.flash td{animation:flash 1.8s ease}
@keyframes flash{0%,30%{background:#FFEDB8}}
td.n{color:var(--muted);width:40px}
.drv{font-weight:800}
.badge{font-size:12px;font-weight:800;padding:3px 11px;border-radius:999px;white-space:nowrap}
.badge.am{background:#FFEDB8;color:#7A4E00}
.badge.pm{background:var(--char);color:var(--cream)}
td.num{font-weight:900}
td.act{white-space:nowrap;text-align:end}
td.act button{border:0;background:none;color:var(--ink);font-weight:800;cursor:pointer;padding:4px 10px;border-radius:999px}
td.act button:hover{background:var(--soft)}
td.act button.del{color:var(--red)}
tfoot td{font-weight:900;border-bottom:0}
.empty{text-align:center;color:var(--muted);padding:34px 10px}

/* ---------- history ---------- */
.mnav{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:18px}
.mnav h2{min-width:200px;text-align:center}
.dow,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dow{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:8px;text-align:center}
.cell{min-height:92px;border-radius:16px;border:1.5px solid var(--line);background:#fff;text-align:start;padding:8px 10px;display:flex;flex-direction:column;gap:2px;cursor:pointer;transition:transform .15s,border-color .2s}
.cell:hover:not(:disabled){transform:translateY(-2px);border-color:var(--red)}
.cell:disabled{opacity:.4;cursor:default}
.cell.blank{border:0;background:none;cursor:default}
.cd{font-weight:900;font-size:16px}
.cc{font-size:12px}
.ct{font-size:13px;font-weight:800;margin-top:auto}
.cell.lv1{background:#FFF0EE}.cell.lv2{background:#FDD3CF}.cell.lv3{background:#F7928C}
.cell.lv4{background:var(--red);color:var(--cream);border-color:var(--red)}
.cell.today{outline:3px solid var(--yellow);outline-offset:-2px}
.legend{display:flex;gap:6px;align-items:center;justify-content:flex-end;font-size:12px;color:var(--muted);margin-top:14px}
.legend i{width:16px;height:16px;border-radius:5px;display:inline-block;border:1px solid var(--line)}

/* ---------- admin ---------- */
.lock{max-width:420px;margin:30px auto;text-align:center;padding:34px 28px}
.lock .cart-ico{width:70px;margin:0 auto 8px;color:var(--red)}
.lock p{color:var(--muted);margin:6px 0 20px}
.lock form{display:grid;gap:10px}
.lock input{text-align:center;font-size:22px;letter-spacing:.3em;font-weight:900}
.admin-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px;margin-bottom:16px}
.admin-top .mnav{margin:0}
.admin-top .acts{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:18px 20px}
.kpi .t{font-size:13px;font-weight:800;color:var(--muted)}
.kpi .v{display:block;font-size:clamp(24px,2.8vw,34px);font-weight:900;line-height:1.25;margin:4px 0}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.lead{background:var(--red);border-color:var(--red);color:var(--cream)}
.kpi.lead .t,.kpi.lead .s{color:rgba(255,246,238,.82)}
.up{color:#1E8A4F!important;font-weight:800}.down{color:var(--red)!important;font-weight:800}
.kpi.lead .up,.kpi.lead .down{color:var(--yellow)!important}
.chart-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.info{font-size:13px;color:var(--muted);min-height:22px;margin-bottom:4px}
.bars{display:flex;align-items:flex-end;gap:3px;height:230px}
.bar{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;outline:none}
.bar i{display:block;width:100%;max-width:34px;height:var(--h);min-height:3px;border-radius:8px 8px 2px 2px;background:var(--red);transform-origin:bottom;animation:grow .8s var(--ease) backwards;animation-delay:calc(var(--i) * 16ms);transition:filter .2s}
.bar.zero i{background:rgba(35,27,27,.1)}
.bar.peak i{background:var(--yellow);box-shadow:inset 0 0 0 2px var(--char)}
.bar:hover i,.bar:focus i{filter:brightness(1.15)}
.bar span{font-size:10.5px;color:var(--muted);margin-top:5px;height:16px}
@keyframes grow{from{transform:scaleY(0)}}
.dash-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:16px;margin:16px 0}
.stack{display:grid;gap:16px;align-content:start}
.hrow{display:grid;grid-template-columns:minmax(80px,130px) 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(227,30,36,.08)}
.hrow:last-child{border-bottom:0}
.hname{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crown{color:var(--yellow);margin-inline-end:4px;-webkit-text-stroke:1px var(--char)}
.track{height:12px;background:var(--soft);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;width:var(--w);background:var(--red);border-radius:99px;animation:growX .9s var(--ease) backwards;animation-delay:calc(var(--i) * 60ms)}
[dir=rtl] .track i,[dir=rtl] .split i{transform-origin:right}
[dir=ltr] .track i,[dir=ltr] .split i{transform-origin:left}
.hrow.top .track i{background:var(--yellow)}
@keyframes growX{from{transform:scaleX(0)}}
.hval{text-align:end;line-height:1.3}
.hval b{display:block}
.hval small{color:var(--muted);font-size:12px}
.best-note{background:#FFF0C7;border-radius:14px;padding:12px 14px;margin:10px 0 4px;font-size:14px;color:#5A3A00}
.split{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:14px 0 12px;background:var(--soft)}
.split i{display:block;height:100%;animation:growX .9s var(--ease) backwards}
.split .am{background:var(--yellow)}.split .pm{background:var(--char)}
.shift-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.shift-two div{background:var(--soft);border-radius:14px;padding:12px 14px}
.shift-two b{display:block;font-size:20px}
.shift-two small{color:var(--muted)}
.wbars{height:150px}
.ybars{height:200px;gap:10px}
.ybar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;border:0;background:none;padding:0;min-width:0}
.ybar .pair{display:flex;align-items:flex-end;gap:3px;width:100%;height:100%;justify-content:center}
.ybar i{display:block;width:44%;max-width:22px;height:var(--h);min-height:3px;border-radius:6px 6px 2px 2px;transform-origin:bottom;animation:grow .8s var(--ease) backwards;animation-delay:calc(var(--i) * 30ms)}
.ybar i.ly{background:#F2C9C5}.ybar i.ty{background:var(--red)}
.ybar.sel i.ty{background:var(--yellow);box-shadow:inset 0 0 0 2px var(--char)}
.ybar span{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap}
.ybar.sel span{color:var(--ink);font-weight:900}
.keys{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.keys i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:0 0 16px}
.set-grid .card h3{margin-bottom:4px}
.set-grid .card p{color:var(--muted);font-size:13px;margin:0 0 12px}
.taglist{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1.5px solid var(--line);border-radius:999px;padding:5px 6px;padding-inline-start:14px;font-weight:800;font-size:14px}
.tag button{border:0;background:#fff;width:24px;height:24px;border-radius:50%;cursor:pointer;color:var(--muted);line-height:1}
.tag button:hover{color:var(--red)}
.inline{display:flex;gap:8px}
.inline input,.inline select{flex:1}
.inline button{white-space:nowrap}
.inline > span{min-width:110px;align-self:center;font-weight:700}
.btn-col{display:grid;gap:8px}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(35,27,27,.5);backdrop-filter:blur(6px);animation:fade .2s}
.modal[hidden]{display:none}
.modal-card{background:#fff;border-radius:26px;padding:26px;width:min(540px,100%);max-height:90vh;overflow:auto;animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
.modal-card h2{margin-bottom:4px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.rep-table{width:100%;min-width:0;margin-top:14px}
.rep-table td,.rep-table th{padding:9px 6px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}}
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:60;display:grid;gap:8px;justify-items:center;pointer-events:none;width:calc(100% - 32px)}
.toast{background:var(--char);color:var(--cream);padding:12px 22px;border-radius:999px;font-weight:700;box-shadow:0 12px 30px -10px rgba(0,0,0,.35);animation:toastIn .35s cubic-bezier(.2,.9,.3,1.2);max-width:560px;text-align:center}
.toast.err{background:var(--red)}
.toast.out{opacity:0;transform:translateY(10px);transition:all .3s}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96)}}
#printArea{display:none}

@media (max-width:980px){
  .shift-grid,.dash-grid,.set-grid{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:600px){
  .kpis{grid-template-columns:1fr}
  .staff{margin-inline-start:0;width:100%}
  .staff input{flex:1;width:auto}
  .cell{min-height:62px;padding:6px}
  .cell .ct{display:none}
  .bar span{visibility:hidden}
  .bar:nth-child(5n+1) span{visibility:visible}
  .runner{bottom:-20px;width:84px}
  .today{padding-inline-end:70px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;padding:10px;color:#000}
  #printArea table{min-width:0;width:100%}
  #printArea .logo-svg{fill:#E31E24;width:160px}
}

function defaults(){return{v:1,settings:{drivers:[],areas:['الميناء','طرابلس','الكورنيش','الضواحي'],currency:'LBP',morningStart:7,nightStart:15,pin:'',pinSet:false,lang:'ar'},orders:[],staff:{},handed:{},lastBackup:null}}

if(!db||!Array.isArray(db.orders))db=defaults();

if(!db.settings.curV2){db.settings.currency='LBP';db.settings.curV2=true;}
db.staff=db.staff||{};

}

const isLBP=()=>db.settings.currency!=='$';
const fmtN=n=>(isLBP()?Math.round(+n||0):Math.round((+n||0)*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const curLabel=()=>isLBP()?T.lbp:'$';

function workNow(){
  const n=new Date(),h=n.getHours(),s=db.settings;
  const shift=(h>=s.morningStart&&h<s.nightStart)?'صبح':'ليل';
  const d=new Date(n); if(h<s.morningStart)d.setDate(d.getDate()-1);
  return{date:ymd(d),shift};
}

/* ---------- helpers ---------- */
function toast(msg,type){
  const t=document.createElement('div');t.className='toast'+(type?' '+type:'');t.textContent=msg;
  $('#toasts').appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320)},type==='err'?4200:2600);
}
function openModal(html){$('#modalBody').innerHTML=html;$('#modal').hidden=false;const f=$('#modalBody').querySelector('input,button');f&&f.focus()}
function closeModal(){$('#modal').hidden=true;$('#modalBody').innerHTML=''}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('[data-close]'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
function countTo(el,to,isMoney,key){
  if(!el)return;
  const from=key in prevVals?prevVals[key]:0; prevVals[key]=to;
  const fin=isMoney?money(to):fmtN(to);
  if(reduceMotion||from===to){el.textContent=fin;return}
  const t0=performance.now(),dur=700;
  (function f(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3),v=from+(to-from)*e;
    el.textContent=isMoney?money(v):fmtN(Math.round(v));
    if(p<1)requestAnimationFrame(f);else el.textContent=fin})(t0);
}
function download(name,text,type){
  const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);
}
const sum=arr=>arr.reduce((a,o)=>a+(+o.charge||0),0);

/* ---------- Floor Link sync ---------- */
const hkey=(d,s)=>d+'|'+s;
function touch(date,shift){const h=db.handed[hkey(date,shift)];if(h){h.pending=true;h.ver=(h.ver||0)+1}}
function toFs(v){
  if(v===null||v===undefined)return{nullValue:null};
  if(typeof v==='number')return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};
  if(typeof v==='boolean')return{booleanValue:v};
  if(typeof v==='string')return{stringValue:v};
  if(Array.isArray(v))return{arrayValue:{values:v.map(toFs)}};
  const f={};Object.keys(v).forEach(k=>f[k]=toFs(v[k]));return{mapValue:{fields:f}};
}
function shiftPayload(date,shift){
  const os=dayOrders(date).filter(o=>o.shift===shift),by={};
  os.forEach(o=>{const d=by[o.driver]||(by[o.driver]={driver:o.driver,count:0,total:0});d.count++;d.total+=+o.charge||0});
  return{branchId:db.settings.branchId,branch:db.settings.branch||'',date,month:date.slice(0,7),shift:sc(shift),
    staff:db.staff[hkey(date,shift)]||'',currency:db.settings.currency,count:os.length,total:sum(os),
    drivers:Object.values(by),orders:os.map(o=>({time:o.time,driver:o.driver,customer:o.customer,area:o.area||'',charge:+o.charge||0})),
    handedAt:new Date(db.handed[hkey(date,shift)].at).toISOString(),sentAt:new Date().toISOString()};
}
let syncing=false;
async function syncPending(){
  if(syncing||!fbReady()||!navigator.onLine)return;
  const keys=Object.keys(db.handed).filter(k=>db.handed[k].pending);if(!keys.length)return;
  syncing=true;let sent=0;
  for(const k of keys){
    const[date,shift]=k.split('|'),h=db.handed[k],ver=h.ver;
    const id=encodeURIComponent(`${db.settings.branchId}_${date}_${sc(shift)}`);
    const url=`https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents/${FB.collection}/${id}?key=${FB.apiKey}`;
    try{
      const r=await fetch(url,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:toFs(shiftPayload(date,shift)).mapValue.fields})});
      if(!r.ok)throw new Error('HTTP '+r.status);
      if(h.ver===ver)h.pending=false;h.sentAt=Date.now();delete h.err;sent++;
    }catch(e){h.err=String(e.message||e);break}
  }
  try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}
  syncing=false;
  if(sent&&ui.tab==='shift')renderSummary();
  if(sent&&ui.tab==='admin'&&ui.showSettings)renderSettings();
}
window.addEventListener('online',syncPending);
setInterval(syncPending,60000);
function shiftFoot(s,hasRows){
  const h=db.handed[hkey(ui.date,s)];
  let st='';
  if(h){const t=h.sentAt?new Date(h.sentAt):null;
    st=h.pending?`<span class="sync pend">${T.pendingSend}</span>`:`<span class="sync ok">${T.sentAt(t?`${pad(t.getHours())}:${pad(t.getMinutes())}`:'')}</span>`}
  return `<div class="sb-foot">${st}${hasRows?`<button type="button" class="ghost-btn" data-report="${s}">${T.reportBtn}</button>`:''}${h?'':`<button type="button" class="primary" data-handover="${s}">${T.handover}</button>`}</div>`;
}
function handOver(s){
  if(!db.settings.branch){toast(T.needBranch,'err');return}
  const os=dayOrders(ui.date).filter(o=>o.shift===s),k=hkey(ui.date,s);

    <p>${esc(T.handoverBody(os.length,money(sum(os))))}</p>
    <label class="field"><span class="lbl">${T.handoverStaff}</span><input id="hoStaff" value="${esc(db.staff[k]||'')}"></label>
    <div class="modal-actions"><button class="ghost-btn" data-close>${T.cancel}</button><button class="primary" id="hoGo">${T.confirmHandover}</button></div>`);
  $('#hoStaff').focus();
  $('#hoGo').onclick=()=>{
    const n=$('#hoStaff').value.trim();if(!n){toast(T.staffNeeded,'err');$('#hoStaff').focus();return}
    db.staff[k]=n;db.handed[k]={at:Date.now(),pending:true,ver:1};save();closeModal();
    toast(T.handedToast);runCart();renderShift();
  };
}

const dayOrders=date=>db.orders.filter(o=>o.date===date).sort((a,b)=>a.ts-b.ts);

function renderShift(){
  const today=workNow().date,d=ui.date;
  $('#dTitle').textContent=dayLong(d);
  const diff=Math.round((parse(today)-parse(d))/864e5);
  $('#dSub').textContent=diff===0?T.today:diff===1?T.yesterday:T.daysAgo(diff);
  $('#toToday').hidden=diff===0;
  $('#nextDay').disabled=d>=today;
  $('#staffLbl').textContent=T.staffLbl(SN(ui.shift));
  $('#staffInput').value=db.staff[`${d}|${ui.shift}`]||'';
  $('#curLbl').textContent=curLabel();
  renderChips();renderAreas();renderHint();renderSummary();renderTable();
}
function renderChips(){
  const box=$('#driverChips'),ds=db.settings.drivers;
  if(!ds.length){box.innerHTML=`<div class="empty-drivers">${T.noDrivers}</div>`;return}
  if(ui.driver&&!ds.includes(ui.driver)&&!ui.editId)ui.driver=null;
  box.innerHTML=ds.map((n,i)=>`<button type="button" class="chip ${ui.driver===n?'on':''}" data-d="${esc(n)}">${esc(n)}${i<9?`<span class="k">${i+1}</span>`:''}</button>`).join('');
}
$('#driverChips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;ui.driver=b.dataset.d;renderChips();$('#fCustomer').focus()});
function renderAreas(){
  const set=new Set(db.settings.areas);
  for(let i=db.orders.length-1;i>=0&&set.size<60;i--){const a=(db.orders[i].area||'').trim();if(a)set.add(a)}
  $('#areaList').innerHTML=[...set].map(a=>`<option value="${esc(a)}">`).join('');
}
function renderHint(){
  if(ui.editId){const o=db.orders.find(x=>x.id===ui.editId);$('#formHint').innerHTML=o?T.hintEdit(SN(o.shift),esc(o.time)):'';return}
  $('#formHint').innerHTML=T.hintNew(SN(ui.shift),esc(dayLong(ui.date)));
}
function renderSummary(){
  const os=dayOrders(ui.date),total=sum(os);
  let h=`<div class="sum-head"><h2>${T.shiftsCalc}</h2><div class="day-total"><span>${T.dayTotal}</span><b id="dayTotal" class="m"></b><small>${T.orders(os.length)}</small></div></div>`;
  SHIFTS.forEach(s=>{
    const so=os.filter(o=>o.shift===s),staff=db.staff[`${ui.date}|${s}`];
    const by={};so.forEach(o=>{(by[o.driver]=by[o.driver]||{c:0,t:0});by[o.driver].c++;by[o.driver].t+=+o.charge||0});
    const rows=Object.entries(by).sort((a,b)=>b[1].t-a[1].t);
    h+=`<div class="shift-block ${sc(s)} ${s===ui.shift?'cur':''}">
      <div class="sb-head"><span class="sb-name">${T.shiftTitle[s]}</span>${staff?`<span class="sb-staff">${esc(T.staffIs(staff))}</span>`:''}<b class="sb-total m" id="st-${sc(s)}"></b></div>
      ${rows.length?rows.map(([n,v])=>`<div class="drow"><span class="drv">${esc(n)}</span><span class="c">${T.orders(v.c)}</span><b>${moneyH(v.t)}</b></div>`).join(''):`<div class="sb-empty">${T.noShiftOrders}</div>`}
      ${shiftFoot(s,rows.length>0)}
    </div>`;
  });
  $('#summary').innerHTML=h;
  countTo($('#dayTotal'),total,true,'day|'+ui.date);
  SHIFTS.forEach(s=>countTo($('#st-'+sc(s)),sum(os.filter(o=>o.shift===s)),true,'sh|'+ui.date+s));
}
$('#summary').addEventListener('click',e=>{const b=e.target.closest('[data-report]');if(b)showReport(b.dataset.report);const h=e.target.closest('[data-handover]');if(h)handOver(h.dataset.handover)});

function renderTable(){
  let os=dayOrders(ui.date);if(ui.filter!=='all')os=os.filter(o=>o.shift===ui.filter);
  $$('#filterSeg button').forEach(b=>b.classList.toggle('on',b.dataset.f===ui.filter));
  $('#tbody').innerHTML=os.map((o,i)=>`<tr class="${o.id===ui.flash?'flash':''}" data-id="${o.id}">
    <td class="n">${i+1}</td><td>${esc(o.time)}</td><td class="drv">${esc(o.driver)}</td><td>${esc(o.customer)}</td>
    <td class="muted">${esc(o.area)||'—'}</td><td><span class="badge ${sc(o.shift)}">${SN(o.shift)}</span></td>
    <td class="num">${moneyH(o.charge)}</td>
    <td class="act"><button type="button" data-edit>${T.edit}</button><button type="button" class="del" data-del>${T.del}</button></td></tr>`).join('');
  $('#tfoot').innerHTML=os.length?`<tr><td colspan="6">${T.totalRow(os.length)}</td><td>${moneyH(sum(os))}</td><td></td></tr>`:'';
  const em=$('#emptyRows');em.hidden=!!os.length;
  em.textContent=ui.filter==='all'?T.emptyAll:T.emptyShift(SN(ui.filter));

$('#filterSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ui.filter=b.dataset.f;renderTable()});
$('#tbody').addEventListener('click',e=>{
  const tr=e.target.closest('tr');if(!tr)return;const o=db.orders.find(x=>x.id===tr.dataset.id);if(!o)return;
  if(e.target.closest('[data-edit]')){startEdit(o);return}
  if(e.target.closest('[data-del]')){
    openModal(`<h2>${T.deleteQ}</h2><p class="muted">${esc(T.deleteBody(o.customer,o.driver,money(o.charge)))}</p>
      <div class="modal-actions"><button class="ghost-btn" data-close>${T.keep}</button><button class="primary danger" id="confirmDel">${T.confirmDel}</button></div>`);
    $('#confirmDel').onclick=()=>{db.orders=db.orders.filter(x=>x.id!==o.id);touch(o.date,o.shift);save();closeModal();if(ui.editId===o.id)resetForm();renderShift();toast(T.deleted)};
  }
});

function startEdit(o){
  ui.editId=o.id;ui.driver=o.driver;
  $('#fCustomer').value=o.customer;$('#fArea').value=o.area||'';$('#fCharge').value=fmtN(o.charge);
  $('#formTitle').textContent=T.editOrder;$('#submitBtn').textContent=T.saveEdit;$('#cancelEdit').hidden=false;
  renderChips();renderHint();$('#entryForm').scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'start'});$('#fCustomer').focus();
}
function resetForm(){
  ui.editId=null;$('#fCustomer').value='';$('#fArea').value='';$('#fCharge').value='';
  $('#formTitle').textContent=T.newOrder;$('#submitBtn').textContent=T.addOrder;$('#cancelEdit').hidden=true;renderHint();
}
$('#cancelEdit').addEventListener('click',()=>{resetForm();renderChips()});
$('#fCharge').addEventListener('input',e=>{const el=e.target;let v=el.value.replace(/[^\d.]/g,'');if(isLBP())v=v.replace(/\./g,'');else{const i=v.indexOf('.');if(i>-1)v=v.slice(0,i+1)+v.slice(i+1).replace(/\./g,'').slice(0,2)}const[a,b]=v.split('.');const f=a?Number(a).toLocaleString('en-US'):'';el.value=b!==undefined?`${f||'0'}.${b}`:f;});

$('#entryForm').addEventListener('submit',e=>{
  e.preventDefault();
  const customer=$('#fCustomer').value.trim(),area=$('#fArea').value.trim(),raw=$('#fCharge').value.replace(/[^\d.]/g,''),charge=parseFloat(raw);
  if(!db.settings.drivers.length){toast(T.needDrivers,'err');return}
  if(!ui.driver){const c=$('#driverChips');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');toast(T.pickDriver,'err');return}
  if(!customer){$('#fCustomer').focus();toast(T.needCustomer,'err');return}
  if(raw===''||!(charge>=0)){$('#fCharge').focus();toast(T.needCharge,'err');return}
  if(ui.editId){
    const o=db.orders.find(x=>x.id===ui.editId);
    if(o){Object.assign(o,{driver:ui.driver,customer,area,charge});ui.flash=o.id;touch(o.date,o.shift)}
    save();resetForm();toast(T.edited);
  }else{
    const n=new Date(),id=uid();
    db.orders.push({id,date:ui.date,shift:ui.shift,time:`${pad(n.getHours())}:${pad(n.getMinutes())}`,driver:ui.driver,customer,area,charge,ts:Date.now()});
    ui.flash=id;touch(ui.date,ui.shift);
    if(save()){toast(T.added(customer,ui.driver));runCart()}
    resetForm();
  }
  renderShift();$('#fCustomer').focus();
});

$('#staffInput').addEventListener('change',e=>{
  const k=`${ui.date}|${ui.shift}`,v=e.target.value.trim();
  if(v)db.staff[k]=v;else delete db.staff[k];touch(ui.date,ui.shift);save();renderSummary();
});
function shiftDay(n){const d=parse(ui.date);d.setDate(d.getDate()+n);const s=ymd(d);if(s>workNow().date)return;ui.date=s;resetForm();renderShift()}
$('#prevDay').addEventListener('click',()=>shiftDay(-1));
$('#nextDay').addEventListener('click',()=>shiftDay(1));
$('#toToday').addEventListener('click',()=>{ui.date=workNow().date;resetForm();renderShift()});

document.addEventListener('keydown',e=>{
  if(ui.tab!=='shift'||!$('#modal').hidden)return;
  const tag=(document.activeElement&&document.activeElement.tagName)||'';
  if(/INPUT|SELECT|TEXTAREA/.test(tag)||e.ctrlKey||e.metaKey||e.altKey)return;
  const n=parseInt(e.key,10);
  if(n>=1&&n<=9&&db.settings.drivers[n-1]){ui.driver=db.settings.drivers[n-1];renderChips();$('#fCustomer').focus();e.preventDefault()}
});

function showReport(s){
  const os=dayOrders(ui.date).filter(o=>o.shift===s),staff=db.staff[`${ui.date}|${s}`]||'';
  const by={};os.forEach(o=>{(by[o.driver]=by[o.driver]||{c:0,t:0});by[o.driver].c++;by[o.driver].t+=+o.charge||0});
  const rows=Object.entries(by).sort((a,b)=>b[1].t-a[1].t);
  const body=`<h2>${T.reportTitle(SN(s))}</h2><p class="muted" style="margin:0">${esc(dayLong(ui.date))}${staff?`، ${esc(T.staffIs(staff))}`.replace('،',T.dir==='rtl'?'،':','):''}</p>
    <table class="rep-table"><thead><tr><th>${T.driver}</th><th>${T.ordersCount}</th><th>${T.amount}</th></tr></thead>
    <tbody>${rows.map(([n,v])=>`<tr><td><b>${esc(n)}</b></td><td>${v.c}</td><td>${moneyH(v.t)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>${T.total}</td><td>${os.length}</td><td>${moneyH(sum(os))}</td></tr></tfoot></table>`;
  openModal(body+`<div class="modal-actions"><button class="ghost-btn" data-close>${T.close}</button><button class="primary" id="printRep">${T.print}</button></div>`);

/* ---------- HISTORY ---------- */
function renderHistory(){
  const y=ui.hY,m=ui.hM,nd=new Date(y,m+1,0).getDate(),offset=(new Date(y,m,1).getDay()+6)%7,today=workNow().date,pre=mkey(y,m);
  $('#hTitle').textContent=`${T.months[m]} ${y}`;
  const t=new Date();$('#hNext').disabled=(y>t.getFullYear())||(y===t.getFullYear()&&m>=t.getMonth());
  const days=Array.from({length:nd},()=>({c:0,t:0}));
  db.orders.forEach(o=>{if(o.date.startsWith(pre)){const i=+o.date.slice(8)-1;days[i].c++;days[i].t+=+o.charge||0}});
  const max=Math.max(1,...days.map(d=>d.t));
  let h='';for(let i=0;i<offset;i++)h+='<div class="cell blank"></div>';
  days.forEach((a,i)=>{
    const ds=`${pre}-${pad(i+1)}`,lv=a.c?Math.max(1,Math.ceil(a.t/max*4)):0;
    h+=`<button type="button" class="cell ${lv?'lv'+lv:''} ${ds===today?'today':''}" data-date="${ds}" ${ds>today?'disabled':''} aria-label="${esc(dayLong(ds))}">
      <span class="cd">${i+1}</span>${a.c?`<span class="cc">${T.orders(a.c)}</span><span class="ct">${moneyH(a.t)}</span>`:''}</button>`;
  });
  $('#cal').innerHTML=h;
}
$('#cal').addEventListener('click',e=>{const c=e.target.closest('.cell[data-date]');if(!c||c.disabled)return;ui.date=c.dataset.date;ui.filter='all';resetForm();setTab('shift')});
$('#hPrev').addEventListener('click',()=>{ui.hM--;if(ui.hM<0){ui.hM=11;ui.hY--}renderHistory()});
$('#hNext').addEventListener('click',()=>{ui.hM++;if(ui.hM>11){ui.hM=0;ui.hY++}renderHistory()});

/* ---------- ADMIN ---------- */
function monthStats(y,m){
  const pre=mkey(y,m),nd=new Date(y,m+1,0).getDate();
  const days=Array.from({length:nd},()=>({count:0,total:0}));
  const drivers={},shifts={'صبح':{count:0,total:0},'ليل':{count:0,total:0}},areas={};
  const wd=Array.from({length:7},()=>({total:0,days:new Set()}));
  let total=0,count=0;
  db.orders.forEach(o=>{
    if(!o.date.startsWith(pre))return;
    const c=+o.charge||0,i=+o.date.slice(8)-1;total+=c;count++;
    days[i].count++;days[i].total+=c;
    const dr=drivers[o.driver]||(drivers[o.driver]={count:0,total:0,days:new Set()});dr.count++;dr.total+=c;dr.days.add(o.date);
    if(shifts[o.shift]){shifts[o.shift].count++;shifts[o.shift].total+=c}
    const a=(o.area||'').trim();if(a)areas[a]=(areas[a]||0)+1;
    const w=wd[parse(o.date).getDay()];w.total+=c;w.days.add(o.date);
  });
  let best=-1;days.forEach((d,i)=>{if(d.count&&(best<0||d.total>days[best].total))best=i});
  return{days,drivers,shifts,areas,wd,total,count,active:days.filter(d=>d.count).length,best};
}
function monthTotals(){const map={};db.orders.forEach(o=>{const k=o.date.slice(0,7);const v=map[k]||(map[k]={count:0,total:0});v.count++;v.total+=+o.charge||0});return map}
const pct=p=>`<span class="${p>=0?'up':'down'}">${p>=0?'▲':'▼'} ${Math.abs(p)}%</span>`;

function renderAdmin(){
  const el=$('#v-admin');$('#lockIco').textContent=ui.unlocked?'🔓':'🔒';
  const[aL,aR]=arrows();
  if(!ui.unlocked){
    const set=db.settings.pinSet;
    el.innerHTML=`<div class="card lock"><svg class="cart-ico" viewBox="0 0 350 270" aria-hidden="true">${$('#runner .cart').innerHTML}</svg><h2>${set?T.lockTitle:T.createTitle}</h2>
      <p>${set?T.lockText:T.createText}</p>
      <form id="pinForm"><input type="password" inputmode="numeric" id="pin1" maxlength="8" placeholder="••••" aria-label="${T.pin}">
      ${set?'':`<input type="password" inputmode="numeric" id="pin2" maxlength="8" placeholder="${T.pin2}" aria-label="${T.pin2}">`}
      <button class="primary" type="submit">${set?T.openDash:T.createOpen}</button></form></div>`;
    $('#pin1').focus();
    $('#pinForm').addEventListener('submit',e=>{
      e.preventDefault();const p=$('#pin1').value.trim();
      if(!set){
        if(!/^\d{4,8}$/.test(p)){toast(T.pinRule,'err');return}
        if(p!==$('#pin2').value.trim()){toast(T.pinMismatch,'err');return}
        db.settings.pin=p;db.settings.pinSet=true;save();ui.unlocked=true;ui.showSettings=!db.settings.drivers.length;renderAdmin();toast(T.pinSaved);return;
      }
      if(p===db.settings.pin){ui.unlocked=true;renderAdmin()}
      else{const c=$('.lock');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');$('#pin1').value='';toast(T.pinWrong,'err')}
    });
    return;
  }

  const y=ui.aY,m=ui.aM,s=monthStats(y,m),mt=monthTotals(),MN=T.months;
  const pY=m===0?y-1:y,pM=m===0?11:m-1,prev=mt[mkey(pY,pM)];
  let delta='';
  if(prev&&prev.total>0)delta=T.delta(pct(Math.round((s.total-prev.total)/prev.total*100)),MN[pM]);
  else if(s.count)delta=T.noPrev(MN[pM]);
  const t=new Date(),isFuture=(y>t.getFullYear())||(y===t.getFullYear()&&m>=t.getMonth());
  const avg=s.active?s.total/s.active:0;

  let banner='';
  const since=db.lastBackup?Math.floor((Date.now()-db.lastBackup)/864e5):null;
  if(db.orders.length&&(since===null||since>=7))banner=`<div class="banner"><span>${since===null?T.noBackup:T.backupDays(since)} ${T.backupAdvice}</span><button class="primary" data-act="backup">${T.backupNow}</button></div>`;

  const vals=s.days.map(d=>ui.metric==='count'?d.count:d.total),vmax=Math.max(1,...vals);
  const bars=s.days.map((d,i)=>{const dn=T.days[parse(`${mkey(y,m)}-${pad(i+1)}`).getDay()];
    return `<div class="bar ${d.count?'':'zero'} ${i===s.best?'peak':''}" tabindex="0" style="--i:${i}" data-info="${esc(T.dayInfo(dn,i+1,MN[m],d.count,money(d.total)))}"><i style="--h:${vals[i]/vmax*100}%"></i><span>${i+1}</span></div>`}).join('');

  const dr=Object.entries(s.drivers).map(([name,v])=>({name,count:v.count,total:v.total,days:v.days.size})).sort((a,b)=>b.total-a.total||b.count-a.count);
  const dmax=Math.max(1,...dr.map(d=>d.total));
  const drHtml=dr.length?dr.map((d,i)=>`<div class="hrow ${i===0?'top':''}"><div class="hname">${i===0?'<span class="crown">★</span>':''}${esc(d.name)}</div>
      <div class="track"><i style="--w:${d.total/dmax*100}%;--i:${i}"></i></div>
      <div class="hval"><b>${moneyH(d.total)}</b><small>${T.driverSub(d.count,d.days)}</small></div></div>`).join(''):`<p class="muted">${T.noMonthData}</p>`;
  const bestDr=dr[0]?`<div class="best-note">${T.bestDriver(MN[m],esc(dr[0].name),dr[0].count,(dr[0].count/Math.max(1,dr[0].days)).toFixed(1))}</div>`:'';

  const am=s.shifts['صبح'],pm=s.shifts['ليل'],stot=Math.max(1,am.total+pm.total);
  const order=T.dowOrder,wvals=order.map(i=>s.wd[i].days.size?s.wd[i].total/s.wd[i].days.size:0),wmax=Math.max(1,...wvals),wbest=wvals.indexOf(Math.max(...wvals));
  const wbars=order.map((di,k)=>`<div class="bar ${wvals[k]?'':'zero'} ${wvals[k]&&k===wbest?'peak':''}" tabindex="0" style="--i:${k}" data-info="${esc(T.wInfo(T.days[di],money(wvals[k])))}"><i style="--h:${wvals[k]/wmax*100}%"></i><span>${T.daysShort[di]}</span></div>`).join('');

  const ty=[],ly=[];for(let i=0;i<12;i++){ty.push((mt[mkey(y,i)]||{}).total||0);ly.push((mt[mkey(y-1,i)]||{}).total||0)}
  const ymax=Math.max(1,...ty,...ly),yT=ty.reduce((a,b)=>a+b,0);
  const ybars=ty.map((v,i)=>`<button type="button" class="ybar ${i===m?'sel':''}" data-month="${i}" data-info="${esc(`${MN[i]}: ${y} ${money(v)} / ${y-1} ${money(ly[i])}`)}"><span class="pair"><i class="ly" style="--h:${ly[i]/ymax*100}%;--i:${i}"></i><i class="ty" style="--h:${v/ymax*100}%;--i:${i}"></i></span><span>${T.mshort[i]}</span></button>`).join('');
  let yCmp='';const lastM=y===t.getFullYear()?t.getMonth():11;
  const tyS=ty.slice(0,lastM+1).reduce((a,b)=>a+b,0),lyS=ly.slice(0,lastM+1).reduce((a,b)=>a+b,0);
  if(lyS>0)yCmp=`, ${T.yCmp(pct(Math.round((tyS-lyS)/lyS*100)),y-1)}`;

  const ar=Object.entries(s.areas).sort((a,b)=>b[1]-a[1]).slice(0,6),amax=Math.max(1,...ar.map(a=>a[1]));
  const arHtml=ar.length?ar.map(([n,c],i)=>`<div class="hrow"><div class="hname">${esc(n)}</div><div class="track"><i style="--w:${c/amax*100}%;--i:${i}"></i></div><div class="hval"><b>${c}</b><small>${T.orderWord}</small></div></div>`).join(''):`<p class="muted">${T.noAreas}</p>`;
  const bestLbl=s.best>=0?`${T.days[parse(`${mkey(y,m)}-${pad(s.best+1)}`).getDay()]} ${s.best+1}`:'—';

  el.innerHTML=`
  <div class="card admin-top">
    <div class="mnav"><button class="icon-btn" data-act="mprev" aria-label="${T.prevMonth}">${aL}</button><h2>${MN[m]} ${y}</h2><button class="icon-btn" data-act="mnext" aria-label="${T.nextMonth}" ${isFuture?'disabled':''}>${aR}</button></div>
    <div class="acts"><button class="ghost-btn" data-act="settings">${ui.showSettings?T.hideSettings:T.settingsBtn}</button><button class="ghost-btn" data-act="lock">${T.lock}</button></div>
  </div>
  ${banner}
  <div id="settingsWrap"></div>
  <div class="kpis">
    <div class="card kpi lead"><span class="t">${T.monthTotal}</span><b class="v m" id="k1"></b><span class="s">${delta}</span></div>
    <div class="card kpi"><span class="t">${T.ordersCount}</span><b class="v" id="k2"></b><span class="s">${T.workDays(s.active)}</span></div>
    <div class="card kpi"><span class="t">${T.dailyAvg}</span><b class="v m" id="k3"></b><span class="s">${T.perDay(s.active?(s.count/s.active).toFixed(1):0)}</span></div>
    <div class="card kpi"><span class="t">${T.bestDay}</span><b class="v">${bestLbl}</b><span class="s">${s.best>=0?`${money(s.days[s.best].total)}، ${T.orders(s.days[s.best].count)}`.replace('،',T.dir==='rtl'?'،':','):T.noData}</span></div>
  </div>
  <div class="card">
    <div class="chart-head"><h3>${T.byDay}</h3><div class="seg"><button type="button" data-metric="total" class="${ui.metric==='total'?'on':''}">${T.amount}</button><button type="button" data-metric="count" class="${ui.metric==='count'?'on':''}">${T.ordersCount}</button></div></div>
    <div class="info">${T.dailyInfo}</div>
    <div class="bars">${bars}</div>
  </div>
  <div class="dash-grid">
    <div class="card"><h3>${T.ranking}</h3>${bestDr}${drHtml}</div>
    <div class="stack">
      <div class="card"><h3>${T.amOrPm}</h3>
        <div class="split"><i class="am" style="width:${am.total/stot*100}%"></i><i class="pm" style="width:${pm.total/stot*100}%"></i></div>
        <div class="shift-two"><div><small>${T.shiftSwitch['صبح']}</small><b>${moneyH(am.total)}</b><small>${T.orders(am.count)}</small></div><div><small>${T.shiftSwitch['ليل']}</small><b>${moneyH(pm.total)}</b><small>${T.orders(pm.count)}</small></div></div>
      </div>
      <div class="card"><h3>${T.weekdays}</h3><div class="info">${T.weekInfo}</div><div class="bars wbars">${wbars}</div></div>
    </div>
  </div>
  <div class="card">
    <div class="chart-head"><h3>${T.yearTitle(y)}: ${moneyH(yT)}${yCmp}</h3><div class="keys"><span><i style="background:var(--red)"></i>${y}</span><span><i style="background:#F2C9C5"></i>${y-1}</span></div></div>
    <div class="info">${T.yearInfo}</div>
    <div class="bars ybars">${ybars}</div>
  </div>
  <div class="card" style="margin-top:16px"><h3>${T.topAreas}</h3>${arHtml}</div>`;

  countTo($('#k1'),s.total,true,'k1');countTo($('#k2'),s.count,false,'k2');countTo($('#k3'),avg,true,'k3');
  if(ui.showSettings)renderSettings();
}

function renderSettings(){
  const st=db.settings,hours=Array.from({length:24},(_,h)=>h);
  const opt=v=>hours.map(h=>`<option value="${h}" ${h===v?'selected':''}>${pad(h)}:00</option>`).join('');
  const unsent=Object.values(db.handed).filter(h=>h.pending).length;
  $('#settingsWrap').innerHTML=`<div class="set-grid">
    <div class="card"><h3>${T.setBranch}</h3><p>${T.setBranchText}</p>
      <form class="inline" id="branchForm"><input id="branchIn" value="${esc(st.branch||'')}" placeholder="${T.branchPh}"><button class="primary" type="submit">${T.saveBtn}</button></form>
      <p style="margin:12px 0 0">${fbReady()?T.linkReady:T.linkMissing} ${unsent?T.unsent(unsent):(Object.keys(db.handed).length?T.allSent:'')}</p></div>
    <div class="card"><h3>${T.setDrivers}</h3><p>${T.setDriversText}</p>
      <div class="taglist">${st.drivers.map((d,i)=>`<span class="tag">${esc(d)}<button type="button" data-rmd="${i}" aria-label="${esc(T.remove(d))}">×</button></span>`).join('')||`<span class="muted">${T.noDriversYet}</span>`}</div>
      <form class="inline" id="addDriver"><input id="newDriver" placeholder="${T.driverPh}"><button class="primary" type="submit">${T.add}</button></form></div>
    <div class="card"><h3>${T.setAreas}</h3><p>${T.setAreasText}</p>
      <div class="taglist">${st.areas.map((a,i)=>`<span class="tag">${esc(a)}<button type="button" data-rma="${i}" aria-label="${esc(T.remove(a))}">×</button></span>`).join('')}</div>
      <form class="inline" id="addArea"><input id="newArea" placeholder="${T.areaNamePh}"><button class="primary" type="submit">${T.add}</button></form></div>
    <div class="card"><h3>${T.setShifts}</h3><p>${T.setShiftsText}</p>
      <div class="btn-col">
        <label class="inline"><span>${T.mStart}</span><select id="ms">${opt(st.morningStart)}</select></label>
        <label class="inline"><span>${T.nStart}</span><select id="ns">${opt(st.nightStart)}</select></label>
        <label class="inline"><span>${T.currency}</span><select id="cur">${[['LBP',T.lbp],['$','$']].map(([v,l])=>`<option value="${v}" ${(v==='$')===(st.currency==='$')?'selected':''}>${l}</option>`).join('')}</select></label>
      </div></div>
    <div class="card"><h3>${T.setBackup}</h3><p>${T.backupText} ${db.lastBackup?T.lastBackup(dayLong(ymd(new Date(db.lastBackup)))):T.noBackup}</p>
      <div class="btn-col">
        <button class="primary" type="button" data-act="backup">${T.backupBtn}</button>
        <button class="ghost-btn" type="button" data-act="import">${T.importBtn}</button>
        <button class="ghost-btn" type="button" data-act="csv">${T.csvBtn(T.months[ui.aM])}</button>
      </div>
      <h3 style="margin-top:18px">${T.changePin}</h3>
      <form class="inline" id="pinChange" style="margin-top:8px"><input type="password" inputmode="numeric" maxlength="8" id="np" placeholder="${T.newPin}"><button class="ghost-btn" type="submit">${T.changePinBtn}</button></form>
    </div></div>`;
  $('#branchForm').addEventListener('submit',e=>{e.preventDefault();st.branch=$('#branchIn').value.trim();save();toast(T.savedShort)});
  $('#addDriver').addEventListener('submit',e=>{e.preventDefault();const v=$('#newDriver').value.trim();if(!v)return;if(st.drivers.includes(v)){toast(T.exists,'err');return}st.drivers.push(v);save();renderSettings();$('#newDriver').focus();toast(T.addedName(v))});
  $('#addArea').addEventListener('submit',e=>{e.preventDefault();const v=$('#newArea').value.trim();if(!v||st.areas.includes(v))return;st.areas.push(v);save();renderSettings();$('#newArea').focus()});
  $('#ms').addEventListener('change',e=>{st.morningStart=+e.target.value;save();lastAuto=workNow();toast(T.savedShort)});
  $('#ns').addEventListener('change',e=>{st.nightStart=+e.target.value;save();lastAuto=workNow();toast(T.savedShort)});
  $('#cur').addEventListener('change',e=>{st.currency=e.target.value;save();renderAdmin()});
  $('#pinChange').addEventListener('submit',e=>{e.preventDefault();const p=$('#np').value.trim();if(!/^\d{4,8}$/.test(p)){toast(T.pinRule,'err');return}st.pin=p;save();$('#np').value='';toast(T.pinChanged)});
}

$('#v-admin').addEventListener('click',e=>{
  const rd=e.target.closest('[data-rmd]');if(rd){const n=db.settings.drivers.splice(+rd.dataset.rmd,1)[0];save();renderSettings();toast(T.removed(n));return}
  const ra=e.target.closest('[data-rma]');if(ra){db.settings.areas.splice(+ra.dataset.rma,1);save();renderSettings();return}
  const mb=e.target.closest('[data-metric]');if(mb){ui.metric=mb.dataset.metric;renderAdmin();return}
  const yb=e.target.closest('.ybar');if(yb){ui.aM=+yb.dataset.month;renderAdmin();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='mprev'){ui.aM--;if(ui.aM<0){ui.aM=11;ui.aY--}renderAdmin()}
  if(a==='mnext'){ui.aM++;if(ui.aM>11){ui.aM=0;ui.aY++}renderAdmin()}
  if(a==='lock'){ui.unlocked=false;ui.showSettings=false;renderAdmin()}
  if(a==='settings'){ui.showSettings=!ui.showSettings;renderAdmin()}
  if(a==='backup'){db.lastBackup=Date.now();save();download(`shoppies-backup-${ymd(new Date())}.json`,JSON.stringify(db),'application/json');toast(T.backupDone);renderAdmin()}
  if(a==='import')$('#importFile').click();
  if(a==='csv'){
    const pre=mkey(ui.aY,ui.aM),rows=db.orders.filter(o=>o.date.startsWith(pre)).sort((x,y)=>x.ts-y.ts);
    const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
    const csv='\uFEFF'+[T.csvHead.map(q).join(',')]
      .concat(rows.map(o=>[o.date,T.days[parse(o.date).getDay()],SN(o.shift),o.time,o.driver,o.customer,o.area,o.charge].map(q).join(','))).join('\r\n');
    download(`shoppies-${pre}.csv`,csv,'text/csv;charset=utf-8');toast(T.csvDone);
  }
});
['mouseover','focusin'].forEach(ev=>$('#v-admin').addEventListener(ev,e=>{
  const b=e.target.closest('[data-info]');if(!b)return;const card=b.closest('.card');const inf=card&&card.querySelector('.info');if(inf)inf.textContent=b.dataset.info;
}));
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);if(!d||!Array.isArray(d.orders))throw 0;
    const ids=new Set(db.orders.map(o=>o.id));let added=0;
    d.orders.forEach(o=>{if(o&&o.id&&o.date&&!ids.has(o.id)){db.orders.push(o);added++}});
    if(d.staff)Object.keys(d.staff).forEach(k=>{if(!db.staff[k])db.staff[k]=d.staff[k]});
    if(d.settings&&Array.isArray(d.settings.drivers))d.settings.drivers.forEach(n=>{if(!db.settings.drivers.includes(n))db.settings.drivers.push(n)});
    save();renderAdmin();toast(T.imported(added));
  }catch(err){toast(T.badFile,'err')}};
  r.readAsText(f);e.target.value='';
});

/* ---------- boot ---------- */
document.body.dataset.shift=sc(ui.shift);
$$('.shift-switch button').forEach(b=>b.setAttribute('aria-checked',b.dataset.s===ui.shift));
applyLang();
setInterval(tick,20000);
if(!reduceMotion)runCart();
})();
</script>
</body>
</html>
