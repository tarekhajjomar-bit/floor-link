<style>
:root{
  --ink:#16221F;
  --ink-soft:#4B5B57;
  --paper:#F1F0EA;
  --surface:#FFFFFF;
  --line:#D9D6CC;
  --line-soft:#E6E4DB;
  --teal:#0E6E63;
  --teal-deep:#0A5049;
  --teal-tint:#E1EFEC;
  --amber:#B8791A;
  --amber-tint:#FBEDD7;
  --red:#B4402A;
  --red-tint:#FBE6E0;
  --green:#3E7D4C;
  --green-tint:#E5F1E4;
  --radius:16px;
  --radius-sm:12px;
  --shadow-sm:0 1px 2px rgba(20,20,16,.05), 0 1px 1px rgba(20,20,16,.04);
  --shadow-md:0 2px 6px rgba(20,20,16,.06), 0 8px 20px -8px rgba(20,20,16,.10);
  --ease:cubic-bezier(.2,.7,.3,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EDEEE9; --ink-soft:#AEB6B0; --paper:#151A18; --surface:#1C2220;
    --line:#33403A; --line-soft:#2A342F; --teal:#3FA294; --teal-deep:#2F8478;
    --teal-tint:#17302B; --amber:#E0A94B; --amber-tint:#332711;
    --red:#E17A63; --red-tint:#34201B; --green:#7BC48C; --green-tint:#1B2E1F;
  }
}
:root[data-theme="dark"]{
  --ink:#EDEEE9; --ink-soft:#AEB6B0; --paper:#151A18; --surface:#1C2220;
  --line:#33403A; --line-soft:#2A342F; --teal:#3FA294; --teal-deep:#2F8478;
  --teal-tint:#17302B; --amber:#E0A94B; --amber-tint:#332711;
  --red:#E17A63; --red-tint:#34201B; --green:#7BC48C; --green-tint:#1B2E1F;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100%; background:var(--paper); color:var(--ink);
  font-family:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
[dir="rtl"] body{font-family:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif;}
button,input,select,textarea{font-family:inherit; color:inherit;}
h1,h2,h3,p{margin:0;}

.app-header{
  position:sticky; top:0; z-index:20; overflow:hidden;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);
  background:var(--teal-deep); color:#F5FAF8;
  padding-inline:16px; padding-bottom:14px;
}
.header-watermark{
  position:absolute; top:-18px; inset-inline-end:-24px; width:150px; height:150px;
  object-fit:contain; opacity:.16; pointer-events:none;
  filter:brightness(0) invert(1);
  transition:opacity .25s ease;
}
.brand-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.brand{display:flex; align-items:center; gap:10px; min-width:0;}
.brand-mark{
  width:34px; height:34px; border-radius:8px; background:#F5FAF8; color:var(--teal-deep);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex:none;
  overflow:hidden; padding:4px;
}
.brand-mark img{width:100%; height:100%; object-fit:contain; display:block;}
.brand-text h1{font-size:15px; font-weight:600; line-height:1.25;}
.brand-text span{font-size:11.5px; opacity:.78; display:block;}
.header-controls{display:flex; gap:6px; flex:none;}
.pill-btn{
  border:1px solid rgba(245,250,248,.35); background:transparent; color:#F5FAF8;
  border-radius:999px; padding:6px 12px; font-size:12.5px; font-weight:600; cursor:pointer;
  transition:background-color .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease), transform .12s var(--ease);
}
.pill-btn:active{transform:scale(.95);}
.pill-btn.active{background:#F5FAF8; color:var(--teal-deep); border-color:transparent;}
.tabbar{display:flex; gap:4px; margin-top:14px; background:rgba(0,0,0,.16); border-radius:12px; padding:3px;}
#deptbar{overflow-x:auto; -webkit-overflow-scrolling:touch;}
#deptbar .tab-btn{flex:none; padding-inline:12px; white-space:nowrap;}
.tab-btn{
  flex:1; text-align:center; padding:9px 6px; border:none; background:transparent; color:#F5FAF8;
  opacity:.72; border-radius:9px; font-size:13.5px; font-weight:600; cursor:pointer;
  transition:background-color .18s var(--ease), color .18s var(--ease), opacity .18s var(--ease), box-shadow .18s var(--ease);
}
.tab-btn.active{background:#F5FAF8; color:var(--teal-deep); opacity:1; box-shadow:var(--shadow-sm);}
#userChip{font-size:11.5px; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
#logoutBtn{width:30px; height:30px; padding:0; display:flex; align-items:center; justify-content:center; flex:none;}
#logoutBtn svg{width:14px; height:14px;}

main{max-width:640px; margin:0 auto; padding:16px; padding-bottom:64px;}
.auth-wrap{max-width:420px; margin:32px auto 0;}
.auth-logo{width:56px; height:56px; border-radius:14px; background:var(--teal-tint); color:var(--teal-deep); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:20px; margin:0 auto 14px;}
.auth-title{font-size:19px; font-weight:700; text-align:center; margin-bottom:4px;}
.auth-sub{font-size:12.5px; color:var(--ink-soft); text-align:center; margin-bottom:20px;}
.auth-switch{text-align:center; margin-top:14px; font-size:13px; color:var(--ink-soft);}
.auth-switch button{background:none; border:none; color:var(--teal); font-weight:700; cursor:pointer; font-size:13px; padding:2px 4px;}
.role-pick{display:flex; gap:8px;}
.role-pick-btn{flex:1; border:1.5px solid var(--line); background:var(--paper); border-radius:var(--radius-sm); padding:12px 8px; text-align:center; cursor:pointer; transition:all .15s var(--ease);}
.role-pick-btn.sel{border-color:var(--teal); background:var(--teal-tint); box-shadow:var(--shadow-sm);}
.role-pick-btn b{display:block; font-size:12.5px; margin-top:4px;}
.role-pick-btn svg{width:18px; height:18px; margin:0 auto; display:block; color:var(--teal-deep);}
.account-row{display:flex; align-items:center; gap:10px; padding:12px 0; border-top:1px solid var(--line-soft);}
.account-row:first-child{border-top:none;}
.account-avatar{width:36px; height:36px; border-radius:50%; background:var(--teal-tint); color:var(--teal-deep); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:none;}
.account-info{flex:1; min-width:0;}
.account-info b{font-size:13.5px; display:block;}
.account-info span{font-size:11.5px; color:var(--ink-soft); display:block;}
.role-tag{font-size:10.5px; font-weight:700; border-radius:999px; padding:2px 9px; white-space:nowrap;}
.role-tag-manager{background:var(--teal-tint); color:var(--teal-deep);}
.role-tag-supervisor{background:var(--amber-tint); color:var(--amber);}
.role-tag-merchandiser{background:var(--green-tint); color:var(--green);}
.icon-btn{border:none; background:var(--paper); width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); flex:none; transition:transform .1s var(--ease), background-color .12s var(--ease);}
.icon-btn:active{transform:scale(.9);}
.icon-btn svg{width:14px; height:14px;}
.icon-btn.danger{color:var(--red);}
#scannerBox{width:100%; border-radius:var(--radius-sm); overflow:hidden; background:#000; min-height:260px;}
.role-note{
  font-size:12px; color:var(--ink-soft); background:var(--surface); border:1px solid var(--line-soft);
  border-radius:var(--radius); padding:10px 12px; margin-bottom:14px; display:flex; align-items:center; gap:8px;
}
.role-note strong{color:var(--ink); font-weight:600;}

.card{
  background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius);
  padding:18px; margin-bottom:14px; box-shadow:var(--shadow-sm);
}
.section-title{font-size:14.5px; font-weight:700; margin-bottom:2px; letter-spacing:-.1px;}
.section-sub{font-size:12px; color:var(--ink-soft); margin-bottom:12px;}
.field{margin-bottom:12px;}
.field:last-child{margin-bottom:0;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
.field input[type="text"], .field input[type="date"], .field input[type="time"],
.field input[type="password"],
.field select, .field textarea{
  width:100%; border:1.5px solid var(--line); border-radius:var(--radius-sm); background:var(--paper);
  padding:10px 12px; font-size:14.5px; color:var(--ink);
  transition:border-color .16s var(--ease), box-shadow .16s var(--ease), background-color .16s var(--ease);
}
.field textarea{min-height:64px; resize:vertical; font-family:inherit;}
.field input:focus, .field select:focus, .field textarea:focus{
  outline:none; border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-tint); background:var(--surface);
}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.chip-row{display:flex; gap:8px; flex-wrap:wrap;}
.chip{
  border:1.5px solid var(--line); background:var(--paper); border-radius:999px; padding:8px 15px;
  font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-soft);
  transition:background-color .16s var(--ease), border-color .16s var(--ease), color .16s var(--ease), transform .1s var(--ease), box-shadow .16s var(--ease);
}
.chip:active{transform:scale(.96);}
.chip.chip-ok.sel{background:var(--green-tint); border-color:var(--green); color:var(--green); box-shadow:var(--shadow-sm);}
.chip.chip-issue.sel{background:var(--red-tint); border-color:var(--red); color:var(--red); box-shadow:var(--shadow-sm);}
.chip.chip-shift.sel{background:var(--teal-tint); border-color:var(--teal); color:var(--teal-deep); box-shadow:var(--shadow-sm);}
.chip.sel::before{content:"✓"; margin-inline-end:4px; font-weight:700;}
.chip-yn{padding:6px 13px; font-size:12px;}
.chip-yn.sel::before{content:none;}
.check-list{border-top:1px solid var(--line-soft); padding-top:10px;}
.check-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--line-soft);}
.check-row:first-child{border-top:none;}
.check-row-label{font-size:12.5px; color:var(--ink); flex:1;}

.cat{border-top:1px solid var(--line-soft); padding-top:14px; margin-top:14px;}
.cat:first-of-type{border-top:none; padding-top:0; margin-top:0;}
.cat-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px;}
.cat-head h3{font-size:13.5px; font-weight:600;}

.photo-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
.photo-thumb{position:relative; width:66px; height:66px; border-radius:12px; overflow:hidden; border:1px solid var(--line); box-shadow:var(--shadow-sm);}
.photo-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
.photo-thumb .rm{
  position:absolute; top:3px; inset-inline-end:3px; width:19px; height:19px; border-radius:50%;
  background:rgba(15,15,12,.68); color:#fff; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center; backdrop-filter:blur(2px);
  transition:transform .12s var(--ease), background-color .12s var(--ease);
}
.photo-thumb .rm:active{transform:scale(.88);}
.photo-thumb .rm svg{width:9px; height:9px;}
.photo-add{
  width:66px; height:66px; border-radius:12px; border:1.5px dashed var(--line); background:var(--paper);
  display:flex; align-items:center; justify-content:center; color:var(--ink-soft); cursor:pointer;
  transition:border-color .16s var(--ease), background-color .16s var(--ease), transform .1s var(--ease);
}
.photo-add:active{transform:scale(.95);}
.photo-add svg{width:20px; height:20px;}
.photo-add input{display:none;}
.hint{font-size:11.5px; color:var(--ink-soft); margin-top:6px;}

.sig-box{border:1.5px solid var(--line); border-radius:var(--radius-sm); background:var(--paper); touch-action:none;}
.sig-actions{display:flex; justify-content:space-between; align-items:center; margin-top:6px;}
.link-btn{border:none; background:none; color:var(--teal); font-size:12.5px; font-weight:600; cursor:pointer; padding:4px; transition:opacity .12s var(--ease);}
.link-btn:active{opacity:.6;}
.ack-row{display:flex; align-items:flex-start; gap:9px; font-size:13px; color:var(--ink); margin-top:8px;}
.ack-row input{margin-top:3px; accent-color:var(--teal);}

.btn{
  width:100%; border:none; border-radius:var(--radius-sm); padding:13px; font-size:14.5px; font-weight:700; cursor:pointer;
  transition:transform .1s var(--ease), box-shadow .16s var(--ease), opacity .16s var(--ease), background-color .16s var(--ease);
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--teal); color:#fff; box-shadow:0 2px 10px -2px color-mix(in srgb, var(--teal) 55%, transparent);}
.btn-primary:disabled{opacity:.45; box-shadow:none;}
.btn-secondary{background:var(--paper); color:var(--ink); border:1.5px solid var(--line);}

.badge{
  display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; border-radius:999px;
  padding:4px 11px; white-space:nowrap;
}
.badge-pending{background:var(--amber-tint); color:var(--amber);}
.badge-approved{background:var(--green-tint); color:var(--green);}
.badge-issues{background:var(--red-tint); color:var(--red);}
.badge-neutral{background:var(--paper); color:var(--ink-soft); border:1px solid var(--line);}
.item-thumb{width:44px; height:44px; border-radius:10px; object-fit:cover; border:1px solid var(--line); flex:none; background:var(--paper);}
.alert-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line-soft);}
.alert-row:first-child{border-top:none;}
.compliance-row{display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-top:1px solid var(--line-soft); font-size:13px;}
.compliance-row:first-child{border-top:none;}
.badge::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}

.filters{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin-bottom:12px;}
.filters select{
  flex:none; border:1.5px solid var(--line); border-radius:var(--radius-sm); background:var(--surface); padding:8px 11px; font-size:13px;
}
.stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px;}
.stat{background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius); padding:12px; text-align:center; box-shadow:var(--shadow-sm);}
.stat b{display:block; font-size:20px; font-family:'IBM Plex Mono',monospace;}
.stat span{font-size:10.5px; color:var(--ink-soft);}

.log-card{
  background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius); margin-bottom:10px; overflow:hidden;
  box-shadow:var(--shadow-sm); transition:box-shadow .16s var(--ease);
}
.log-head{padding:14px 15px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px; transition:background-color .12s var(--ease);}
.log-head:active{background-color:var(--paper);}
.log-head .info b{font-size:14px; display:block;}
.log-head .info span{font-size:12px; color:var(--ink-soft);}
.log-head-right{display:flex; align-items:center; gap:8px; flex:none;}
.log-chevron{width:16px; height:16px; color:var(--ink-soft); transition:transform .22s var(--ease); flex:none;}
.log-card.open .log-chevron{transform:rotate(180deg);}
.log-body{padding:0 15px 15px; border-top:1px solid var(--line-soft);}
.log-cat{padding:10px 0; border-top:1px solid var(--line-soft);}
.log-cat:first-child{border-top:none;}
.log-cat-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
.log-cat-head b{font-size:12.5px;}
.log-note{font-size:12.5px; color:var(--ink-soft); line-height:1.5;}
.thumb-sm{width:52px; height:52px; border-radius:9px; object-fit:cover; border:1px solid var(--line); margin-inline-end:6px; margin-top:6px;}
.sig-strip{display:flex; gap:16px; margin-top:10px;}
.sig-strip div{flex:1;}
.sig-strip img{width:100%; max-height:60px; object-fit:contain; background:var(--paper); border-radius:9px; border:1px solid var(--line);}
.mgr-box{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);}
.empty{text-align:center; padding:40px 16px; color:var(--ink-soft); font-size:13.5px;}
.toast{
  position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--paper); padding:11px 18px; border-radius:999px; font-size:13px; font-weight:600;
  z-index:50; box-shadow:0 10px 30px -6px rgba(0,0,0,.3); display:flex; align-items:center; gap:7px;
  animation:toast-in .22s var(--ease);
}
@keyframes toast-in{ from{opacity:0; transform:translateX(-50%) translateY(8px);} to{opacity:1; transform:translateX(-50%) translateY(0);} }
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,14,12,.5); z-index:60;
  display:flex; align-items:flex-end; justify-content:center;
  animation:overlay-in .18s var(--ease);
}
@keyframes overlay-in{ from{opacity:0;} to{opacity:1;} }
.modal-sheet{
  width:100%; max-width:640px; background:var(--surface); border-radius:20px 20px 0 0;
  padding:22px; padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  max-height:85vh; overflow-y:auto;
  animation:sheet-up .24s var(--ease);
}
@keyframes sheet-up{ from{transform:translateY(16px); opacity:.6;} to{transform:translateY(0); opacity:1;} }
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
.modal-head h2{font-size:16px; font-weight:700;}
.modal-close{border:none; background:var(--paper); width:30px; height:30px; border-radius:50%; cursor:pointer; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; transition:background-color .12s var(--ease), transform .1s var(--ease);}
.modal-close:active{transform:scale(.92);}
.modal-close svg{width:13px; height:13px;}
.modal-sub{font-size:12.5px; color:var(--ink-soft); margin-bottom:16px;}
.form-error{font-size:12.5px; color:var(--red); margin-top:6px;}
.form-ok{font-size:12.5px; color:var(--green); margin-top:6px;}
.divider-note{border-top:1px solid var(--line-soft); margin-top:18px; padding-top:16px;}
.locked-card{background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius); padding:40px 20px; text-align:center; margin-top:8px; box-shadow:var(--shadow-sm);}
.locked-icon{width:30px; height:30px; margin:0 auto 12px; color:var(--ink-soft); opacity:.85;}
.req-tag{font-size:10.5px; font-weight:700; color:var(--red); background:var(--red-tint); border-radius:999px; padding:2px 8px; margin-inline-start:6px;}
.req-block{border-top:1px solid var(--line-soft); padding-top:14px; margin-top:14px;}
.req-block:first-of-type{border-top:none; padding-top:0; margin-top:0;}
.req-block-head{display:flex; align-items:center; margin-bottom:8px;}
.req-block-head h3{font-size:13.5px; font-weight:600;}
.auth-wrap{max-width:420px; margin:24px auto 0;}
.auth-switch{text-align:center; font-size:13px; color:var(--ink-soft); margin-top:14px;}
.auth-switch button{background:none; border:none; color:var(--teal); font-weight:700; cursor:pointer; font-size:13px; padding:0 3px;}
.btn-danger{background:var(--red-tint); color:var(--red); border:1.5px solid var(--red);}
.acct-row{display:flex; align-items:center; gap:10px; padding:12px 0; border-top:1px solid var(--line-soft);}
.acct-row:first-child{border-top:none;}
.acct-info{flex:1; min-width:0;}
.acct-info b{font-size:13.5px; display:block;}
.acct-info span{font-size:11.5px; color:var(--ink-soft); display:block; margin-top:1px;}
.acct-actions{display:flex; align-items:center; gap:6px; flex:none;}
.acct-role-select{border:1px solid var(--line); border-radius:8px; background:var(--paper); padding:5px 7px; font-size:11.5px;}
.scanner-overlay{position:fixed; inset:0; background:#000; z-index:70; display:flex; flex-direction:column;}
.scanner-video-wrap{flex:1; position:relative; overflow:hidden; background:#000;}
.scanner-video-wrap video{width:100%; height:100%; object-fit:cover;}
#qrReaderDiv{width:100%; height:100%;}
#qrReaderDiv video{width:100% !important; height:100% !important; object-fit:cover !important;}
.scanner-frame{position:absolute; inset:15% 10%; border:2px solid rgba(255,255,255,.75); border-radius:16px; pointer-events:none;}
.scanner-topbar{position:absolute; top:0; left:0; right:0; padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px; display:flex; justify-content:space-between; align-items:center; background:linear-gradient(rgba(0,0,0,.55), transparent); z-index:2;}
.scanner-topbar h2{color:#fff; font-size:14.5px; font-weight:600;}
.scanner-topbar button{border:none; background:rgba(255,255,255,.18); width:32px; height:32px; border-radius:50%; color:#fff; display:flex; align-items:center; justify-content:center;}
.scanner-hint{position:absolute; bottom:16px; left:16px; right:16px; text-align:center; color:#fff; font-size:12.5px; background:rgba(0,0,0,.45); padding:8px 12px; border-radius:10px;}
.scanner-form{background:var(--surface); padding:18px; padding-bottom:calc(20px + env(safe-area-inset-bottom,0px)); border-radius:18px 18px 0 0;}

/* brand theming — accent colors switch with the selected company, echoing each logo */
:root[data-brand="shoppies"]{
  --teal:#C4291B; --teal-deep:#7A1810; --teal-tint:#FBE7E3;
}
:root[data-brand="omar"]{
  --teal:#2A2521; --teal-deep:#141210; --teal-tint:#ECE6D8;
}
.sync-banner{
  margin-top:10px; display:flex; align-items:center; gap:7px; font-size:11.5px; font-weight:600;
  background:rgba(0,0,0,.18); color:#F5FAF8; border-radius:9px; padding:7px 11px;
}
.sync-banner .dot{width:7px; height:7px; border-radius:50%; background:#E0A94B; flex:none;}
.sync-banner.is-offline .dot{background:#E17A63;}
.sync-banner.is-syncing .dot{animation:pulse-dot 1s ease-in-out infinite;}
@keyframes pulse-dot{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
</style>
</head>
<body>
<header class="app-header">
  <img class="header-watermark" id="headerWatermark" alt="" src="">
  <div class="brand-row">
    <div class="brand">
      <div class="brand-mark" id="brandMark"><span id="brandMarkFallback">SH</span></div>
      <div class="brand-text">
        <h1 id="appTitle">Shift Handover</h1>
        <span id="appSub">Retail operations log</span>
      </div>
    </div>
    <div class="header-controls">
      <span class="pill-btn" id="userChip" style="cursor:default;"></span>
      <button class="pill-btn" id="logoutBtn" type="button" title="Logout"></button>
      <button class="pill-btn" id="langToggle" type="button">العربية</button>
    </div>
  </div>
  <div class="sync-banner" id="syncBanner" style="display:none;"></div>
  <div class="tabbar" id="deptbar" style="margin-top:10px;">
    <button class="tab-btn active" id="deptHandoverBtn" type="button"></button>
    <button class="tab-btn" id="deptMerchBtn" type="button"></button>
    <button class="tab-btn" id="deptAccountsBtn" type="button" style="display:none;"></button>
    <button class="tab-btn" id="deptExpiryBtn" type="button" style="display:none;"></button>
  </div>
  <div class="tabbar" id="subtabbar">
    <button class="tab-btn active" id="tabForm" type="button"></button>
    <button class="tab-btn" id="tabDash" type="button"></button>
  </div>
</header>
<main id="main"></main>
<div id="toastHost"></div>
<div id="modalHost"></div>
<div id="scannerHost"></div>

/* ---------- offline queue & sync ---------- */
var QUEUE_KEY = "sh_pending_queue";

function loadQueue(){
  try{
    var raw = localStorage.getItem(QUEUE_KEY);
    S.pendingQueue = raw ? JSON.parse(raw) : [];
  }catch(e){ S.pendingQueue = []; }
}
function saveQueueToStorage(){
  try{ localStorage.setItem(QUEUE_KEY, JSON.stringify(S.pendingQueue)); }catch(e){}
}
function queueForSync(collectionName, doc){
  S.pendingQueue.push({
    localId: "q" + Date.now() + "_" + Math.random().toString(36).slice(2,8),
    collection: collectionName,
    doc: doc
  });
  saveQueueToStorage();
  updateSyncBanner();
}

function saveOrQueue(collectionName, doc, cb){
  if(navigator.onLine && S.db){
    S.db.collection(collectionName).add(doc).then(function(){
      cb(false);
    }).catch(function(){
      queueForSync(collectionName, doc);
      cb(true);
    });
  } else {
    queueForSync(collectionName, doc);
    cb(true);
  }
}

function trySyncQueue(){
  if(S.syncingQueue) return;
  if(!S.db || !navigator.onLine || !S.pendingQueue.length) { updateSyncBanner(); return; }
  S.syncingQueue = true;
  updateSyncBanner();
  var items = S.pendingQueue.slice();
  var remaining = [];
  var syncedCount = 0;
  var next = function(i){
    if(i >= items.length){
      S.pendingQueue = remaining;
      saveQueueToStorage();
      S.syncingQueue = false;
      updateSyncBanner();
      if(syncedCount > 0) toast(t("syncedToast"));
      return;
    }
    var item = items[i];
    S.db.collection(item.collection).add(item.doc).then(function(){
      syncedCount++;
      next(i+1);
    }).catch(function(){
      remaining.push(item);
      next(i+1);
    });
  };
  next(0);
}

function updateSyncBanner(){
  var el = document.getElementById("syncBanner");
  if(!el) return;
  var offline = !navigator.onLine;
  var pending = S.pendingQueue.length;
  if(!offline && !pending && !S.syncingQueue){
    el.style.display = "none";
    return;
  }
  el.style.display = "flex";
  el.classList.toggle("is-offline", offline);
  el.classList.toggle("is-syncing", !!S.syncingQueue);
  var label = S.syncingQueue ? t("syncingNow") : (offline ? t("offlineIndicator") : "");
  var parts = [];
  if(label) parts.push(label);
  if(pending) parts.push(pending + " " + t("pendingSyncLabel"));
  el.innerHTML = '<span class="dot"></span><span>'+esc(parts.join(" · "))+'</span>';
}

function computeStatus(f){
  if(f.pending.urgent || f.cash.status === "issue" || f.inventory.status === "issue" || f.cleanliness.status === "issue"){
    return "issues";
  }
  var hasNo = REQUIRED_NOTE_KEYS.some(function(k){
    return REQUIRED_CHECKLIST_ITEMS.some(function(item){ return f.requiredNotes[k][item.key] === false; });
  });
  if(hasNo){ return "issues"; }
  if(f.entryType === "handover"){
    if(!f.incomingSig && !f.ackIn){ return "pending"; }
  } else {
    if(!f.outgoingSig && !f.ackOut){ return "pending"; }
  }
  return "approved";
}

function hashPw(pw){
  var enc = new TextEncoder().encode("sh_v1:" + pw);
  return crypto.subtle.digest("SHA-256", enc).then(function(buf){
    var bytes = Array.prototype.slice.call(new Uint8Array(buf));
    return bytes.map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
  });
}

}

  var brandKey = brandKeyFor(companyId);
  if(brandKey){

    if(mark) mark.innerHTML = '<img src="'+LOGO_URIS[brandKey]+'" alt="">';
    if(watermark){ watermark.src = LOGO_URIS[brandKey]; watermark.style.opacity = ".16"; }
  } else {
    document.documentElement.removeAttribute("data-brand");
    if(mark) mark.innerHTML = '<span>SH</span>';
    if(watermark){ watermark.style.opacity = "0"; }
  }
}

var sigCtx = {};
function setupSigCanvas(which, existingUrl){
  var canvas = document.getElementById("sigCanvas_"+which);
  if(!canvas) return;
  var ratio = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.floor(rect.width * ratio));
  canvas.height = Math.max(1, Math.floor(190 * ratio));
  var ctx = canvas.getContext("2d");
  ctx.scale(ratio, ratio);
  ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.strokeStyle = getComputedStyle(document.body).color;
  sigCtx[which] = {canvas:canvas, ctx:ctx, drawing:false, dirty:false};
  if(existingUrl && existingUrl.url){
    var img = new Image();
    img.onload = function(){ ctx.drawImage(img, 0, 0, rect.width, 190); sigCtx[which].dirty = true; };
    img.src = existingUrl.url;
  }
  function pos(e){
    var r = canvas.getBoundingClientRect();
    var cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    var cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return {x:cx, y:cy};
  }
  function start(e){ e.preventDefault(); var st = sigCtx[which]; st.drawing = true; var p = pos(e); st.ctx.beginPath(); st.ctx.moveTo(p.x,p.y); }
  function move(e){ var st = sigCtx[which]; if(!st.drawing) return; e.preventDefault(); var p = pos(e); st.ctx.lineTo(p.x,p.y); st.ctx.stroke(); st.dirty = true; }
  function end(e){ var st = sigCtx[which]; st.drawing = false; }
  canvas.addEventListener("pointerdown", start);
  canvas.addEventListener("pointermove", move);
  window.addEventListener("pointerup", end);
  canvas.addEventListener("touchstart", start, {passive:false});
  canvas.addEventListener("touchmove", move, {passive:false});
  canvas.addEventListener("touchend", end);
}

function wireForm(){
  var f = S.form;
  var fCompanySel = document.getElementById("f_company");
  if(fCompanySel) fCompanySel.onchange = function(){ f.company = this.value; applyBrand(f.company); };
  document.getElementById("f_branch").oninput = function(){ f.branch = this.value; };
  document.getElementById("f_date").onchange = function(){ f.date = this.value; };
  document.getElementById("f_time").onchange = function(){ f.time = this.value; };
  var inEl = document.getElementById("f_in");
  if(inEl) inEl.onchange = function(){
    f.incomingUserId = this.value || null;
    var match = S.users.filter(function(u){ return u.id === this.value; }, this)[0];
    f.incomingName = match ? match.fullName : "";
  };
  document.getElementById("f_pendingNotes").oninput = function(){ f.pending.notes = this.value; };
  document.getElementById("f_urgent").onchange = function(){ f.pending.urgent = this.checked; };
  document.getElementById("f_staffNotes").oninput = function(){ f.staffNotes = this.value; };
  var closingCheckEl = document.getElementById("f_closingCheck");
  if(closingCheckEl) closingCheckEl.onchange = function(){ f.closingCheck = this.checked; };

  Array.prototype.forEach.call(document.querySelectorAll("[data-entrytype]"), function(btn){
    btn.onclick = function(){
      f.entryType = this.getAttribute("data-entrytype");
      if(f.entryType !== "handover"){ f.incomingName = ""; f.incomingUserId = null; f.incomingSig = null; f.ackIn = false; }
      renderForm();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-cat-status]"), function(btn){
    btn.onclick = function(){
      var parts = this.getAttribute("data-cat-status").split(":");
      var cur = f[parts[0]].status;
      f[parts[0]].status = (cur === parts[1]) ? "" : parts[1];
      renderForm();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-cat-notes]"), function(ta){
    ta.oninput = function(){ f[this.getAttribute("data-cat-notes")].notes = this.value; };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-reqcheck]"), function(btn){
    btn.onclick = function(){
      var parts = this.getAttribute("data-reqcheck").split("|");
      f.requiredNotes[parts[0]][parts[1]] = (parts[2] === "yes");
      renderForm();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-ack]"), function(cb){
    cb.onchange = function(){
      if(this.getAttribute("data-ack") === "out") f.ackOut = this.checked; else f.ackIn = this.checked;
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-sig-clear]"), function(btn){
    btn.onclick = function(){
      var which = this.getAttribute("data-sig-clear");
      var st = sigCtx[which];
      if(st){ st.ctx.clearRect(0,0,st.canvas.width,st.canvas.height); st.dirty = false; }
      if(which === "out") f.outgoingSig = null; else f.incomingSig = null;
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-photo-rm]"), function(btn){
    btn.onclick = function(){
      var raw = this.getAttribute("data-photo-rm");
      var sep = raw.lastIndexOf("|");
      var key, idx;
      if(sep >= 0){ key = raw.slice(0, sep); idx = parseInt(raw.slice(sep+1), 10); }
      else { var parts = raw.split(":"); key = parts[0]; idx = parseInt(parts[1],10); }
      photosArrFor(key).splice(idx, 1);
      renderForm();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-photo-add]"), function(inp){
    inp.onchange = function(){
      var key = this.getAttribute("data-photo-add");
      var files = Array.prototype.slice.call(this.files || []);
      files.forEach(function(file){ uploadPhoto(key, file); });
      this.value = "";
    };
  });
  document.getElementById("handoverForm").onsubmit = function(e){
    e.preventDefault();
    submitHandover();
  };
}

function uploadPhoto(catKey, file){
  if(!S.assets) return;
  var arrRef = photosArrFor(catKey);
  var placeholderIdx = arrRef.length;
  var localUrl = URL.createObjectURL(file);
  arrRef.push({url:localUrl, id:null, pending:true});
  renderForm();
  S.assets.upload(file).then(function(res){
    var arr = photosArrFor(catKey);
    var item = arr[placeholderIdx];
    if(item && item.pending){ item.id = res.id; item.url = res.url; item.pending = false; }
    renderForm();
  }).catch(function(err){
    photosArrFor(catKey).splice(placeholderIdx, 1);
    renderForm();
    toast(t("connError"));
  });
}

function canvasToUpload(which){
  return new Promise(function(resolve){
    var st = sigCtx[which];
    if(!st || !st.dirty || !S.assets){ resolve(null); return; }
    st.canvas.toBlob(function(blob){
      if(!blob){ resolve(null); return; }
      S.assets.upload(blob, {type:"image/png"}).then(function(res){
        resolve({id:res.id, url:res.url});
      }).catch(function(){ resolve(null); });
    }, "image/png");
  });
}

function submitHandover(){
  var f = S.form;
  var needIncoming = f.entryType === "handover";
  if(!f.branch.trim() || !f.outgoingName.trim() || (needIncoming && !f.incomingName.trim()) || !f.date){
    toast(needIncoming ? t("reqError") : t("reqErrorSolo"));
    return;
  }
  var missing = REQUIRED_PHOTO_KEYS.filter(function(k){
    return !f.requiredPhotos[k].some(function(p){ return p.id; });
  });
  if(missing.length){
    if(!S.canWriteAssets){
      toast(t("reqPhotosBlocked"));
    } else {
      toast(t("reqPhotoMissing") + missing.map(function(k){ return t(k); }).join(S.lang==="ar" ? "، " : ", "));
    }
    return;
  }
  var missingNotes = REQUIRED_NOTE_KEYS.filter(function(k){
    return REQUIRED_CHECKLIST_ITEMS.some(function(item){ return f.requiredNotes[k][item.key] === null; });
  });
  if(missingNotes.length){
    toast(t("reqPhotoMissing") + missingNotes.map(function(k){ return t(k) + t("reqNoteMissing"); }).join(S.lang==="ar" ? "، " : ", "));
    return;
  }
  if(f.entryType === "closing" && !f.closingCheck){
    toast(t("closingCheckMissing"));
    return;
  }
  f.submitting = true;
  renderForm();

  Promise.all([canvasToUpload("out"), canvasToUpload("in")]).then(function(sigs){
    if(sigs[0]) f.outgoingSig = sigs[0];
    if(sigs[1]) f.incomingSig = sigs[1];

    var photoIds = function(cat){
      return f[cat].photos.filter(function(p){ return p.id; }).map(function(p){ return p.id; });
    };
    var reqPhotoIds = {};
    REQUIRED_PHOTO_KEYS.forEach(function(k){
      reqPhotoIds[k] = f.requiredPhotos[k].filter(function(p){ return p.id; }).map(function(p){ return p.id; });
    });
    var reqNoteVals = {};
    REQUIRED_NOTE_KEYS.forEach(function(k){
      var obj = {};
      REQUIRED_CHECKLIST_ITEMS.forEach(function(item){ obj[item.key] = f.requiredNotes[k][item.key]; });
      reqNoteVals[k] = obj;
    });

    var doc = {
      company: f.company, branch: f.branch.trim(),
      entryType: f.entryType, date: f.date, time: f.time,
      outgoingName: f.outgoingName.trim(), incomingName: f.incomingName.trim(),
      incomingUserId: f.incomingUserId || null,
      submittedByUserId: S.currentUser ? S.currentUser.id : null,
      submittedByUsername: S.currentUser ? S.currentUser.username : null,
      cash: {status: f.cash.status, notes: f.cash.notes.trim(), photos: photoIds("cash")},
      inventory: {status: f.inventory.status, notes: f.inventory.notes.trim(), photos: photoIds("inventory")},
      cleanliness: {status: f.cleanliness.status, notes: f.cleanliness.notes.trim(), photos: photoIds("cleanliness")},
      pending: {notes: f.pending.notes.trim(), urgent: !!f.pending.urgent},
      staffNotes: f.staffNotes.trim(),
      closingCheck: f.entryType === "closing" ? !!f.closingCheck : false,
      requiredPhotos: reqPhotoIds,
      requiredNotes: reqNoteVals,
      outgoingSig: f.outgoingSig ? f.outgoingSig.id : null,
      incomingSig: f.incomingSig ? f.incomingSig.id : null,
      ackOut: !!f.ackOut, ackIn: !!f.ackIn,
      status: computeStatus(f),
      managerReviewed: false, managerNote: "",
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
    };

    saveOrQueue("handovers", doc, function(queued){
      toast(queued ? t("offlineSavedToast") : t("savedToast"));
      S.form = freshForm();
      applyIdentityToForms();
      S.view = "dashboard";
      setActiveTab();
      render();
    });
  });
}

/* ================= DASHBOARD VIEW ================= */
function statusBadge(status){
  var cls = status === "issues" ? "badge-issues" : status === "approved" ? "badge-approved" : "badge-pending";
  var label = status === "issues" ? t("issuesBadge") : status === "approved" ? t("approvedBadge") : t("pendingBadge");
  return '<span class="badge '+cls+'">'+label+'</span>';
}

function rangeCutoff(){
  var r = S.filters.range;
  var now = new Date();
  if(r === "today"){ var d = new Date(now); d.setHours(0,0,0,0); return d; }
  if(r === "7"){ return new Date(now.getTime() - 7*86400000); }
  if(r === "30"){ return new Date(now.getTime() - 30*86400000); }
  return null;
}

function filteredLogs(){
  var cutoff = rangeCutoff();
  return S.logs.filter(function(l){
    if(!isManagerUser() && (!S.currentUser || l.submittedByUserId !== S.currentUser.id)) return false;
    if(S.filters.company && l.company !== S.filters.company) return false;
    if(S.filters.status && l.status !== S.filters.status) return false;
    if(cutoff && new Date(l.createdAt) < cutoff) return false;
    return true;
  });
}

function renderDashboard(){
  var html = "";
  var companyOpts = '<option value="">'+t("filterAll")+'</option>' + COMPANIES.map(function(c){
    return '<option value="'+c.id+'"'+(S.filters.company===c.id?" selected":"")+'>'+esc(S.lang==="ar"?c.ar:c.en)+'</option>';
  }).join("");
  var statusOpts = ['','pending','issues','approved'].map(function(s){
    var lbl = s === "" ? t("filterAllStatus") : s === "pending" ? t("pendingBadge") : s === "issues" ? t("issuesBadge") : t("approvedBadge");
    return '<option value="'+s+'"'+(S.filters.status===s?" selected":"")+'>'+lbl+'</option>';
  }).join("");
  var rangeOpts = [["today",t("today")],["7",t("last7")],["30",t("last30")],["all",t("allTime")]].map(function(r){
    return '<option value="'+r[0]+'"'+(S.filters.range===r[0]?" selected":"")+'>'+r[1]+'</option>';
  }).join("");

  html += '<div class="filters">' +
    '<select id="filt_company">'+companyOpts+'</select>' +
    '<select id="filt_status">'+statusOpts+'</select>' +
    '<select id="filt_range">'+rangeOpts+'</select>' +
  '</div>';

  var list = filteredLogs();
  var pendingCount = list.filter(function(l){ return l.status === "pending"; }).length;
  var issuesCount = list.filter(function(l){ return l.status === "issues"; }).length;
  html += '<div class="stat-row">' +
    '<div class="stat"><b>'+list.length+'</b><span>'+t("statTotal")+'</span></div>' +
    '<div class="stat"><b>'+pendingCount+'</b><span>'+t("statPending")+'</span></div>' +
    '<div class="stat"><b>'+issuesCount+'</b><span>'+t("statIssues")+'</span></div>' +
  '</div>';

  if(!S.db){
    html += '<div class="empty">'+t("dbUnavailable")+'</div>';
  } else if(!S.logsLoaded){
    html += '<div class="empty">'+t("loading")+'</div>';
  } else if(!list.length){
    html += '<div class="empty">'+t("noResults")+'</div>';
  } else {
    list.forEach(function(l){ html += logCard(l); });
  }

  document.getElementById("main").innerHTML = html;
  wireDashboard();
}

function logCard(l){
  var open = !!S.expanded[l.id];
  var entryKey = l.entryType || l.shiftType || "handover";
  var shiftLbl = t("entry"+entryKey.charAt(0).toUpperCase()+entryKey.slice(1));
  var isSoloLog = entryKey !== "handover";
  var head = '<div class="log-head" data-toggle="'+l.id+'">' +
    '<div class="info">' +
      '<b>'+esc(l.branch)+' · '+esc(companyName(l.company))+'</b>' +
      '<span>'+shiftLbl+' · '+fmtDate(l.date)+' · '+esc(l.time||"")+'</span>' +
    '</div>' +
    '<div class="log-head-right">'+statusBadge(l.status)+'<span class="log-chevron">'+ICONS.chevron+'</span></div>' +
  '</div>';

  var body = "";
  if(open){
    body += '<div class="log-body">';
    body += catLogBlock(t("cash"), l.cash);
    body += catLogBlock(t("inventory"), l.inventory);
    body += catLogBlock(t("cleanliness"), l.cleanliness);
    if(l.requiredPhotos){
      REQUIRED_PHOTO_KEYS.forEach(function(k){
        var urls = (l.requiredPhotos[k] || []).map(function(id){ return id; });
        var checklist = l.requiredNotes && l.requiredNotes[k] ? l.requiredNotes[k] : null;
        var checklistHtml = "";
        if(checklist){
          checklistHtml = '<div class="check-list" style="margin-bottom:6px;">' +
            REQUIRED_CHECKLIST_ITEMS.map(function(item){
              var v = checklist[item.key];
              var tag = v === true ? '<span class="badge badge-approved">'+t("yesLabel")+'</span>' :
                        v === false ? '<span class="badge badge-issues">'+t("noLabel")+'</span>' : "";
              return '<div class="check-row"><span class="check-row-label">'+t(item.labelKey)+'</span>'+tag+'</div>';
            }).join("") +
          '</div>';
        }
        if(!urls.length && !checklist) return;
        body += '<div class="log-cat"><div class="log-cat-head"><b>'+t(k)+'</b><span class="req-tag">'+t("requiredTag")+'</span></div>' +
          checklistHtml +
          '<div>' + urls.map(function(u){ return '<img class="thumb-sm" src="'+esc(u)+'">'; }).join("") + '</div>' +
        '</div>';
      });
    }
    if(l.pending && (l.pending.notes || l.pending.urgent)){
      body += '<div class="log-cat"><div class="log-cat-head"><b>'+t("pending")+'</b>' +
        (l.pending.urgent ? statusBadge("issues") : "") + '</div>' +
        '<p class="log-note">'+esc(l.pending.notes || "—")+'</p></div>';
    }
    if(l.staffNotes){
      body += '<div class="log-cat"><div class="log-cat-head"><b>'+t("staffNotesTitle")+'</b></div>' +
        '<p class="log-note">'+esc(l.staffNotes)+'</p></div>';
    }
    if((l.entryType || l.shiftType) === "closing"){
      body += '<div class="log-cat"><div class="log-cat-head"><b>'+t("closingChecklistTitle")+'</b>' +
        (l.closingCheck ? statusBadge("approved") : statusBadge("issues")) + '</div>' +
        '<p class="log-note">'+t("closingCheckLabel")+'</p></div>';
    }
    body += '<div class="sig-strip">' +
      (isSoloLog ?
        '<div><div class="hint">'+t("soloSigLabel")+' — '+esc(l.outgoingName)+'</div>' +
          (l.outgoingSigUrl ? '<img src="'+esc(l.outgoingSigUrl)+'">' : (l.ackOut ? '<p class="hint">✓ '+t("ackSelf")+'</p>' : '')) +
        '</div>'
        :
        '<div><div class="hint">'+t("outgoingSig")+' — '+esc(l.outgoingName)+'</div>' +
          (l.outgoingSigUrl ? '<img src="'+esc(l.outgoingSigUrl)+'">' : (l.ackOut ? '<p class="hint">✓ '+t("ackOutgoing")+'</p>' : '')) +
        '</div>' +
        '<div><div class="hint">'+t("incomingSig")+' — '+esc(l.incomingName)+'</div>' +
          (l.incomingSigUrl ? '<img src="'+esc(l.incomingSigUrl)+'">' : (l.ackIn ? '<p class="hint">✓ '+t("ackIncoming")+'</p>' : '')) +
        '</div>'
      ) +
    '</div>';
    body += '<p class="hint" style="margin-top:10px;">'+t("submittedBy")+' '+fmtDateTime(l.createdAt)+'</p>';

    if(isManagerUser()){
      body += '<div class="mgr-box">';
      if(l.managerReviewed){
        body += '<span class="badge badge-approved">'+t("reviewed")+'</span>';
      } else {
        body += '<button type="button" class="btn btn-secondary" data-review="'+l.id+'" style="margin-bottom:8px;">'+t("markReviewed")+'</button>';
      }
      body += '<div class="field" style="margin-top:8px;"><textarea placeholder="'+t("mgrNotePh")+'" data-mgrnote="'+l.id+'">'+esc(l.managerNote||"")+'</textarea></div>';
      body += '<button type="button" class="link-btn" data-savenote="'+l.id+'">'+t("saveNote")+'</button>';
      body += '<button type="button" class="btn btn-danger" data-delete-log="'+l.id+'" style="margin-top:10px;">'+ICONS.trash+' '+t("deleteEntry")+'</button>';
      body += '</div>';
    } else if(l.managerNote){
      body += '<div class="mgr-box"><b class="hint">'+t("reviewed")+'</b><p class="log-note">'+esc(l.managerNote)+'</p></div>';
    }

    body += '</div>';
  }
  return '<div class="log-card'+(open?" open":"")+'">'+head+body+'</div>';
}

function catLogBlock(label, cat){

function uploadMerchPhoto(file){
  if(!S.assets) return;
  var arrRef = S.merchForm.display.photos;
  var placeholderIdx = arrRef.length;
  var localUrl = URL.createObjectURL(file);
  arrRef.push({url:localUrl, id:null, pending:true});
  renderMerchForm();
  S.assets.upload(file).then(function(res){
    var item = S.merchForm.display.photos[placeholderIdx];
    if(item && item.pending){ item.id = res.id; item.url = res.url; item.pending = false; }
    renderMerchForm();
  }).catch(function(){
    S.merchForm.display.photos.splice(placeholderIdx, 1);
    renderMerchForm();
    toast(t("connError"));
  });
}

function submitMerchVisit(){
  var f = S.merchForm;
  if(!f.merchName.trim() || !f.branch.trim() || !f.date){
    toast(t("merchReqError"));
    return;
  }
  f.submitting = true;
  renderMerchForm();

  var photoIds = f.display.photos.filter(function(p){ return p.id; }).map(function(p){ return p.id; });
  var items = f.hasOrder ? f.orderItems.filter(function(r){ return r.item.trim() || r.supplier.trim(); }).map(function(r){
    return {item:r.item.trim(), supplier:r.supplier.trim()};
  }) : [];

  var doc = {
    merchName: f.merchName.trim(), company: f.company, branch: f.branch.trim(),
    date: f.date, time: f.time,
    submittedByUserId: S.currentUser ? S.currentUser.id : null,
    submittedByUsername: S.currentUser ? S.currentUser.username : null,
    display: {status: f.display.status, notes: f.display.notes.trim(), photos: photoIds},
    hasOrder: !!f.hasOrder, orderItems: items,
    shortages: f.shortages.trim(),
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
  };

  saveOrQueue("merch_visits", doc, function(queued){
    toast(queued ? t("offlineSavedToast") : t("merchSaved"));
    S.merchForm = freshMerchForm();
    applyIdentityToForms();
    S.view = "dashboard";
    render();
  });
}

function resolveMerchPhotoUrls(doc){
  if(doc.display){
    var clone = Object.assign({}, doc.display);
    clone.photoUrls = (clone.photos || []).map(function(id){ return id; });
    doc.display = clone;
  }
  return Object.assign({}, doc);
}

function subscribeMerchLogs(){
  if(!S.db) return;
  S.db.collection("merch_visits").orderBy("createdAt","desc").limit(300).onSnapshot(function(snap){
    S.merchLogs = snap.docs.map(function(d){
      return resolveMerchPhotoUrls(Object.assign({id:d.id}, d.data() || {}));
    });
    S.merchLogsLoaded = true;
    if(S.appMode === "merch" && S.view === "dashboard") renderMerchDashboard();
  }, function(){
    S.merchLogsLoaded = true;
    if(S.appMode === "merch" && S.view === "dashboard") renderMerchDashboard();
  });
}

function merchRangeCutoff(){
  var r = S.merchFilters.range;
  var now = new Date();
  if(r === "today"){ var d = new Date(now); d.setHours(0,0,0,0); return d; }
  if(r === "7"){ return new Date(now.getTime() - 7*86400000); }
  if(r === "30"){ return new Date(now.getTime() - 30*86400000); }
  return null;
}

function filteredMerchLogs(){
  var cutoff = merchRangeCutoff();
  return S.merchLogs.filter(function(l){
    if(!isManagerUser() && (!S.currentUser || l.submittedByUserId !== S.currentUser.id)) return false;
    if(S.merchFilters.company && l.company !== S.merchFilters.company) return false;
    if(S.merchFilters.status === "ok" && (l.display||{}).status !== "ok") return false;
    if(S.merchFilters.status === "issue" && (l.display||{}).status !== "issue") return false;
    if(cutoff && new Date(l.createdAt) < cutoff) return false;
    return true;
  });
}

function merchLogCard(l){
  var open = !!S.merchExpanded[l.id];
  var dstatus = (l.display || {}).status;
  var dBadge = dstatus === "issue" ? statusBadge("issues") : dstatus === "ok" ? statusBadge("approved") : "";
  var head = '<div class="log-head" data-mtoggle="'+l.id+'">' +
    '<div class="info">' +
      '<b>'+esc(l.branch)+' · '+esc(companyName(l.company))+'</b>' +
      '<span>'+esc(l.merchName)+' · '+fmtDate(l.date)+' · '+esc(l.time||"")+'</span>' +
    '</div>' +
    '<div class="log-head-right">'+dBadge+'<span class="log-chevron">'+ICONS.chevron+'</span></div>' +
  '</div>';

  var body = "";
  if(open){
    body += '<div class="log-body">';
    body += '<div class="log-cat"><div class="log-cat-head"><b>'+t("displayTitle")+'</b>'+dBadge+'</div>' +
      '<p class="log-note">'+esc((l.display||{}).notes || "—")+'</p>' +
      '<div>'+((l.display||{}).photoUrls||[]).map(function(u){ return '<img class="thumb-sm" src="'+esc(u)+'">'; }).join("")+'</div>' +
    '</div>';
    body += '<div class="log-cat"><div class="log-cat-head"><b>'+t("orderTitle")+'</b>' +
      (l.hasOrder ? '<span class="badge badge-pending">'+t("orderYes")+'</span>' : '<span class="badge badge-approved">'+t("orderNo")+'</span>') +
    '</div>';
    if(l.hasOrder && l.orderItems && l.orderItems.length){
      body += l.orderItems.map(function(r){
        return '<p class="log-note">'+esc(r.item)+(r.supplier ? ' — '+esc(r.supplier) : '')+'</p>';
      }).join("");
    }
    body += '</div>';
    if(l.shortages){
      body += '<div class="log-cat"><div class="log-cat-head"><b>'+t("shortagesTitle")+'</b></div>' +
        '<p class="log-note">'+esc(l.shortages)+'</p></div>';
    }
    body += '<p class="hint" style="margin-top:10px;">'+t("visitedBy")+' '+esc(l.merchName)+' · '+t("submittedBy")+' '+fmtDateTime(l.createdAt)+'</p>';
    if(isManagerUser()){
      body += '<button type="button" class="btn btn-danger" data-delete-mlog="'+l.id+'" style="margin-top:10px;">'+ICONS.trash+' '+t("deleteEntry")+'</button>';
    }
    body += '</div>';
  }
  return '<div class="log-card'+(open?" open":"")+'">'+head+body+'</div>';
}

  document.getElementById("mfilt_company").onchange = function(){ S.merchFilters.company = this.value; applyBrand(S.merchFilters.company || S.merchForm.company); renderMerchDashboard(); };

function normalizeUsername(u){ return (u||"").trim().toLowerCase(); }

function describeFirebaseError(err){
  console.error("Firestore error:", err);
  var code = err && err.code;
  if(code === "permission-denied"){ return t("authErrPermission"); }
  if(code === "unavailable" || code === "failed-precondition"){ return t("authErrOffline"); }
  return t("authErrGeneric");
}

function hasManagerAccount(){
  return S.users.some(function(u){ return u.role === "manager"; });
}

}

function routeAfterAuth(){
  var role = S.currentUser.role;
  S.appMode = role === "merchandiser" ? "merch" : "handover";
  S.view = "form";
  applyIdentityToForms();
}

function applyIdentityToForms(){
  if(!S.currentUser) return;
  S.form.outgoingName = S.currentUser.fullName;
  S.merchForm.merchName = S.currentUser.fullName;
  if(S.currentUser.company){
    if(S.currentUser.role === "supervisor") S.form.company = S.currentUser.company;
    if(S.currentUser.role === "merchandiser") S.merchForm.company = S.currentUser.company;
    if(S.currentUser.role === "supervisor" || S.currentUser.role === "merchandiser"){
      S.trackContext.company = S.currentUser.company;

function doLogin(){
  if(S.authBusy) return;
  var f = S.loginForm;
  var uname = normalizeUsername(f.username);
  if(!uname || !f.password){ S.authError = t("authErrRequired"); render(); return; }
  if(!S.db){ S.authError = t("authErrGeneric"); render(); return; }
  S.authBusy = true; render();
  S.db.collection("users").where("username","==",uname).limit(1).get().then(function(snap){
    if(snap.empty){ S.authBusy=false; S.authError = t("authErrUserNotFound"); render(); return; }
    var d = snap.docs[0];
    var data = d.data();
    if(data.disabled){ S.authBusy=false; S.authError = t("authErrDisabled"); render(); return; }
    hashPw(f.password).then(function(h){
      S.authBusy = false;
      if(h !== data.passwordHash){ S.authError = t("authErrWrongPw"); render(); return; }
      S.currentUser = Object.assign({id:d.id}, data);
      S.authError = "";
      try{ localStorage.setItem("sh_session_uid", d.id); }catch(e){}
      S.db.doc("users/"+d.id).update({lastLoginAt:new Date().toISOString()}).catch(function(){});
      routeAfterAuth();
      render();
    });
  }).catch(function(err){ S.authBusy=false; S.authError = describeFirebaseError(err); render(); });
}

function doSignup(){
  if(S.authBusy) return;
  var f = S.signupForm;
  var uname = normalizeUsername(f.username);
  if(!f.fullName.trim() || !f.contact.trim() || !uname || !f.password || !f.confirmPassword){
    S.authError = t("authErrRequired"); render(); return;
  }
  if(f.password.length < 4){ S.authError = t("authErrPwShort"); render(); return; }
  if(f.password !== f.confirmPassword){ S.authError = t("authErrPwMismatch"); render(); return; }
  var role = f.role;
  if(role === "manager" && hasManagerAccount()){ role = "supervisor"; }
  if(role === "merchandiser" && !f.department){ S.authError = t("authErrDeptRequired"); render(); return; }
  if((role === "merchandiser" || role === "supervisor") && !f.company){ S.authError = t("authErrCompanyRequired"); render(); return; }
  if(!S.db){ S.authError = t("authErrGeneric"); render(); return; }
  S.authBusy = true; render();
  S.db.collection("users").where("username","==",uname).limit(1).get().then(function(snap){
    if(!snap.empty){ S.authBusy=false; S.authError = t("authErrUserTaken"); render(); return; }
    hashPw(f.password).then(function(h){
      var doc = {
        fullName: f.fullName.trim(), contact: f.contact.trim(), username: uname,
        passwordHash: h, role: role, department: role === "merchandiser" ? f.department : "",
        company: (role === "merchandiser" || role === "supervisor") ? f.company : "", disabled:false,
        createdAt: new Date().toISOString(), lastLoginAt: new Date().toISOString()
      };
      S.db.collection("users").add(doc).then(function(ref){
        S.authBusy = false;
        S.currentUser = Object.assign({id:ref.id}, doc);
        S.authError = "";
        try{ localStorage.setItem("sh_session_uid", ref.id); }catch(e){}
        routeAfterAuth();
        render();
      }).catch(function(err){ S.authBusy=false; S.authError = describeFirebaseError(err); render(); });
    });
  }).catch(function(err){ S.authBusy=false; S.authError = describeFirebaseError(err); render(); });
}

function restoreSession(){
  var uid = null;
  try{ uid = localStorage.getItem("sh_session_uid"); }catch(e){}
  if(!uid){ S.authChecked = true; render(); return; }
  S.db.doc("users/"+uid).get().then(function(snap){
    S.authChecked = true;
    if(snap.exists && !snap.data().disabled){
      S.currentUser = Object.assign({id:uid}, snap.data());
      routeAfterAuth();
    } else {
      try{ localStorage.removeItem("sh_session_uid"); }catch(e){}
    }
    render();
  }).catch(function(){ S.authChecked = true; render(); });
}

function subscribeUsers(){
  if(!S.db) return;
  S.db.collection("users").orderBy("createdAt","asc").limit(500).onSnapshot(function(snap){
    S.users = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data() || {}); });
    S.usersLoaded = true;
    if(S.currentUser){
      var mine = S.users.filter(function(u){ return u.id === S.currentUser.id; })[0];
      if(mine){
        if(mine.disabled){
          S.currentUser = null;
          S.authView = "login";
          try{ localStorage.removeItem("sh_session_uid"); }catch(e){}
        } else {
          S.currentUser = mine;
        }
      }
    }
    render();
  }, function(){});
}

function createAccount(){
  var nf = S.newAccountForm;

    S.accountsError = t("authErrRequired"); renderAccounts(); return;

  if(nf.role === "merchandiser" && !nf.department){ S.accountsError = t("authErrDeptRequired"); renderAccounts(); return; }
  if((nf.role === "merchandiser" || nf.role === "supervisor") && !nf.company){ S.accountsError = t("authErrCompanyRequired"); renderAccounts(); return; }

/* ================= DELETE CONFIRM ================= */

function requestDelete(collectionName, id, soft){
  S.deleteTarget = {collection: collectionName, id: id, soft: !!soft};
  renderDeleteConfirm();
}
function closeDeleteConfirm(){
  S.deleteTarget = null;
  document.getElementById("modalHost").innerHTML = "";
}
function renderDeleteConfirm(){
  var host = document.getElementById("modalHost");
  if(!S.deleteTarget){ host.innerHTML=""; return; }
  var isSoft = S.deleteTarget.soft;
  host.innerHTML = '<div class="modal-overlay" id="delOverlay">' +
    '<div class="modal-sheet">' +
      '<div class="modal-head"><h2>'+(isSoft ? t("deleteProductConfirmTitle") : t("deleteConfirmTitle"))+'</h2>' +
        '<button type="button" class="modal-close" id="delCloseBtn">'+ICONS.close+'</button></div>' +
      '<p class="modal-sub">'+(isSoft ? t("deleteProductConfirmSub") : t("deleteConfirmSub"))+'</p>' +
      '<button type="button" class="btn btn-danger" id="delConfirmBtn">'+t("deleteConfirmBtn")+'</button>' +
    '</div>' +
  '</div>';
  document.getElementById("delCloseBtn").onclick = closeDeleteConfirm;
  document.getElementById("delOverlay").onclick = function(e){ if(e.target.id==="delOverlay") closeDeleteConfirm(); };
  document.getElementById("delConfirmBtn").onclick = function(){
    var target = S.deleteTarget;
    if(!target || !S.db) return;
    if(target.soft){
      var user = S.currentUser;
      var who = {userId: user ? user.id : null, username: user ? user.username : "", fullName: user ? user.fullName : ""};
      var nowIso = new Date().toISOString();
      S.db.doc(target.collection+"/"+target.id).update({
        status: "deleted",
        deletedInfo: Object.assign({at: nowIso}, who),
        history: firebase.firestore.FieldValue.arrayUnion({action:"deleted", userId:who.userId, username:who.username, fullName:who.fullName, at: nowIso})
      }).then(function(){
        closeDeleteConfirm();
        toast(t("deleted"));
      }).catch(function(){ toast(t("connError")); });
    } else {
      S.db.doc(target.collection+"/"+target.id).delete().then(function(){
        closeDeleteConfirm();
        toast(t("deleted"));
      }).catch(function(){ toast(t("connError")); });
    }
  };
}

/* ================= EXPIRY CONTROL: dashboard, catalog, alerts ================= */

function computeDaysLeft(expiryDate){
  var today = new Date(); today.setHours(0,0,0,0);
  var exp = new Date(expiryDate + "T00:00:00");
  return Math.round((exp - today) / 86400000);
}

function daysLeftTag(days){
  if(days < 0) return {cls:"badge-issues", label:t("expiredTag")};
  if(days === 0) return {cls:"badge-issues", label:t("expiresTodayTag")};
  if(days === 1) return {cls:"badge-pending", label:t("dayLeftLabel")};
  var minThr = S.thresholds.length ? Math.min.apply(null, S.thresholds) : 7;
  return {cls: days <= minThr ? "badge-pending" : "badge-neutral", label: days + " " + t("daysLeftLabel")};
}

function subscribeTrackedItems(){
  if(!S.db) return;
  S.db.collection("expiry_items").orderBy("expiryDate","asc").limit(500).onSnapshot(function(snap){
    S.trackedItems = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data() || {}); });
    S.trackedItemsLoaded = true;
    if(S.appMode === "expiry" && S.view === "dashboard") renderTrackedDashboard();
  }, function(){ S.trackedItemsLoaded = true; });
}

function subscribeThresholds(){
  if(!S.db) return;
  S.db.doc("settings/expiry").onSnapshot(function(snap){
    S.thresholdsLoaded = true;
    if(snap.exists && Array.isArray(snap.data().days) && snap.data().days.length){
      S.thresholds = snap.data().days;
      S.thresholdsInput = S.thresholds.join(",");
    }
    if(S.appMode === "expiry" && S.view === "dashboard") renderTrackedDashboard();
  }, function(){ S.thresholdsLoaded = true; });
}

function renderTrackForm(){
  var locked = S.currentUser && (S.currentUser.role === "merchandiser" || S.currentUser.role === "supervisor") && S.currentUser.company;
  if(locked && S.trackContext.company !== S.currentUser.company){
    S.trackContext.company = S.currentUser.company;
    applyBrand(S.trackContext.company);
  }

function filteredTrackedItems(){
  return S.trackedItems.filter(function(l){
    if(l.status === "deleted") return false;
    if(S.trackFilters.company && l.company !== S.trackFilters.company) return false;
    if(S.trackFilters.employee && (l.createdBy||{}).userId !== S.trackFilters.employee) return false;
    return true;
  });
}

function alertItems(){
  var thr = S.thresholds.slice().sort(function(a,b){return a-b;});
  var maxThr = thr.length ? thr[thr.length-1] : 7;
  return filteredTrackedItems().filter(function(l){
    var d = computeDaysLeft(l.expiryDate);
    return d <= maxThr;
  }).sort(function(a,b){ return computeDaysLeft(a.expiryDate) - computeDaysLeft(b.expiryDate); });
}

function complianceReport(periodDays){
  var cutoff = new Date(Date.now() - periodDays*86400000);
  var counts = {};
  S.trackedItems.forEach(function(l){
    if(new Date(l.createdAt) < cutoff) return;
    var by = l.createdBy || {};
    var key = by.userId || by.username || "?";
    if(!counts[key]) counts[key] = {name: by.fullName || by.username || "—", count:0};
    counts[key].count++;
  });
  return Object.keys(counts).map(function(k){ return counts[k]; }).sort(function(a,b){ return b.count - a.count; });
}

function freshTrackForm(barcode, catalogData){
  return {
    barcode: barcode || "",
    productName: catalogData ? (catalogData.name || "") : "",
    image: catalogData && catalogData.image ? {id:catalogData.image, url:catalogData.image} : null,
    size: catalogData ? (catalogData.size || "") : "",
    supplier: catalogData ? (catalogData.supplier || "") : "",
    qty: "",

    company: S.trackContext.company,
    branch: S.trackContext.branch

}

function openScanner(){
  S.scanTarget = {stage:"camera", qr:null, barcode:"", foundInCatalog:false};
  renderScanner();
  startCameraScan();
}

function closeScanner(){
  stopCameraScan();
  S.scanTarget = null;
  document.getElementById("scannerHost").innerHTML = "";
}

function stopCameraScan(){
  if(!S.scanTarget || !S.scanTarget.qr) return;
  var qr = S.scanTarget.qr;
  S.scanTarget.qr = null;
  try{
    qr.stop().then(function(){
      try{ qr.clear(); }catch(e){}
    }).catch(function(){});
  }catch(e){}
}

function startCameraScan(){
  if(typeof Html5Qrcode === "undefined"){
    S.scanTarget.stage = "unsupported";
    renderScanner();
    return;
  }
  // Restrict detection to real product barcode formats (instead of also
  // checking QR/Aztec/PDF417/DataMatrix/etc on every frame) and use the
  // browser's native hardware-accelerated barcode detector where the
  // device supports it — both make recognition noticeably faster.
  var qrConfig = {verbose:false};
  if(typeof Html5QrcodeSupportedFormats !== "undefined"){
    qrConfig.formatsToSupport = [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.ITF,
      Html5QrcodeSupportedFormats.QR_CODE
    ];
  }
  qrConfig.experimentalFeatures = {useBarCodeDetectorIfSupported:true};
  var qr = new Html5Qrcode("qrReaderDiv", qrConfig);
  S.scanTarget.qr = qr;
  qr.start(
    {facingMode:"environment"},
    {fps:15, qrbox:{width:280, height:140}, disableFlip:true},
    function(decodedText){
      if(!S.scanTarget) return;
      stopCameraScan();
      lookupCatalogAndOpenForm(decodedText);
    },
    function(){ /* per-frame scan miss — ignore */ }
  ).catch(function(){
    if(S.scanTarget){ S.scanTarget.qr = null; S.scanTarget.stage = "denied"; renderScanner(); }
  });
}

function lookupCatalogAndOpenForm(barcode){
  S.scanTarget.stage = "loading";
  S.scanTarget.barcode = barcode;
  renderScanner();
  var proceed = function(catalogData, found){
    S.trackForm = freshTrackForm(barcode, catalogData);
    S.scanTarget.stage = "form";
    S.scanTarget.foundInCatalog = found;
    renderScanner();
  };
  if(!S.db){ proceed(null, false); return; }
  S.db.doc("catalog/"+encodeURIComponent(barcode)).get().then(function(snap){
    if(snap.exists){ proceed(snap.data(), true); } else { proceed(null, false); }
  }).catch(function(){ proceed(null, false); });
}

  if(!S.scanTarget){ host.innerHTML = ""; return; }
  var stage = S.scanTarget.stage;
  var html = '<div class="scanner-overlay">' +
    '<div class="scanner-topbar"><h2>'+t("scannerTitle")+'</h2>' +
      '<button type="button" id="scanCloseBtn">'+ICONS.close+'</button></div>';

  if(stage === "camera"){
    html += '<div class="scanner-video-wrap"><div id="qrReaderDiv" style="width:100%; height:100%;"></div><div class="scanner-frame"></div></div>' +
      '<p class="scanner-hint" style="position:relative; background:var(--surface); color:var(--ink); margin:0;">'+t("scannerHint")+'</p>' +
      '<div style="padding:14px;"><button type="button" class="btn btn-secondary" id="scanManualBtn">'+t("useManualEntry")+'</button></div>';
  } else if(stage === "unsupported" || stage === "denied"){
    html += '<div style="flex:1; display:flex; align-items:center; justify-content:center; padding:24px;">' +
      '<p style="color:#fff; text-align:center; font-size:13.5px;">'+(stage==="unsupported"?t("scannerUnsupported"):t("cameraDenied"))+'</p>' +
    '</div>' +
    '<div class="scanner-form"><button type="button" class="btn btn-primary" id="scanManualBtn2">'+t("useManualEntry")+'</button></div>';
  } else if(stage === "manual"){
    html += '<div style="flex:1;"></div>' +
      '<div class="scanner-form">' +
        '<div class="field"><label>'+t("barcodeLabel")+'</label><input type="text" id="manualBarcode" placeholder="'+t("barcodeManualPh")+'"></div>' +
        '<button type="button" class="btn btn-primary" id="manualBarcodeNextBtn">'+t("scanAnotherBtn")+'</button>' +
      '</div>';
  } else if(stage === "loading"){
    html += '<div style="flex:1; display:flex; align-items:center; justify-content:center;"><p style="color:#fff; font-size:13.5px;">'+t("loading")+'</p></div>';
  } else if(stage === "form"){
    var tf = S.trackForm;
    var photoHtml = tf.image ?
      '<div class="photo-thumb" style="width:80px; height:80px;"><img src="'+esc(tf.image.url)+'" alt=""><button class="rm" type="button" id="trackImgRm">'+ICONS.close+'</button></div>' :
      (S.canWriteAssets ? '<label class="photo-add" style="width:80px; height:80px;">'+ICONS.plus+'<input type="file" accept="image/*" capture="environment" id="trackImgAdd"></label>' : '');
    html += '<div style="flex:1; overflow-y:auto;">' +
      '<div class="scanner-form">' +
        '<p class="hint" style="color:var(--teal); font-weight:600;">'+(S.scanTarget.foundInCatalog ? t("productFoundInCatalog") : t("productNotInCatalog"))+'</p>' +
        '<div class="field"><label>'+t("barcodeLabel")+'</label><input type="text" value="'+esc(tf.barcode)+'" disabled></div>' +
        '<div class="field"><label>'+t("productImageLabel")+'</label>' + photoHtml + '</div>' +
        '<div class="field"><label>'+t("productNameLabel")+'</label><input type="text" id="tf_name" placeholder="'+t("productNamePh")+'" value="'+esc(tf.productName)+'"></div>' +
        '<div class="grid-2">' +
          '<div class="field"><label>'+t("productSizeLabel")+'</label><input type="text" id="tf_size" placeholder="'+t("productSizePh")+'" value="'+esc(tf.size)+'"></div>' +
          '<div class="field"><label>'+t("productSupplierLabel")+'</label><input type="text" id="tf_supplier" placeholder="'+t("productSupplierPh")+'" value="'+esc(tf.supplier)+'"></div>' +
        '</div>' +
        '<div class="grid-2">' +
          '<div class="field"><label>'+t("trackQtyLabel")+'</label><input type="text" id="tf_qty" placeholder="'+t("trackQtyPh")+'" value="'+esc(tf.qty)+'"></div>' +
          '<div class="field"><label>'+t("trackExpiryLabel")+'</label><input type="date" id="tf_expiry" value="'+esc(tf.expiryDate)+'"></div>' +
        '</div>' +
        '<button type="button" class="btn btn-primary" id="saveTrackBtn">'+t("saveProductBtn")+'</button>' +
      '</div>' +
    '</div>';
  }
  html += '</div>';
  host.innerHTML = html;
  wireScanner();
}

function wireScanner(){
  document.getElementById("scanCloseBtn").onclick = closeScanner;
  var stage = S.scanTarget.stage;
  if(stage === "camera"){
    document.getElementById("scanManualBtn").onclick = function(){ stopCameraScan(); S.scanTarget.stage = "manual"; renderScanner(); };
  }
  if(stage === "unsupported" || stage === "denied"){
    var btn = document.getElementById("scanManualBtn2");
    if(btn) btn.onclick = function(){ S.scanTarget.stage = "manual"; renderScanner(); };
  }
  if(stage === "manual"){
    document.getElementById("manualBarcodeNextBtn").onclick = function(){
      var val = document.getElementById("manualBarcode").value.trim();
      if(!val) return;
      lookupCatalogAndOpenForm(val);
    };
  }
  if(stage === "form"){
    var tf = S.trackForm;
    document.getElementById("tf_name").oninput = function(){ tf.productName = this.value; };
    document.getElementById("tf_size").oninput = function(){ tf.size = this.value; };
    document.getElementById("tf_supplier").oninput = function(){ tf.supplier = this.value; };
    document.getElementById("tf_qty").oninput = function(){ tf.qty = this.value; };
    document.getElementById("tf_expiry").onchange = function(){ tf.expiryDate = this.value; };
    var imgAdd = document.getElementById("trackImgAdd");
    if(imgAdd) imgAdd.onchange = function(){
      var file = this.files && this.files[0];
      if(!file || !S.assets) return;
      S.assets.upload(file).then(function(res){
        tf.image = {id:res.id, url:res.url};
        renderScanner();
      }).catch(function(){ toast(t("connError")); });
    };
    var imgRm = document.getElementById("trackImgRm");
    if(imgRm) imgRm.onclick = function(){ tf.image = null; renderScanner(); };
    document.getElementById("saveTrackBtn").onclick = submitTrackedProduct;
  }
}

function submitTrackedProduct(){
  var tf = S.trackForm;
  if(!tf.barcode || !tf.productName.trim() || !tf.qty.toString().trim() || !tf.expiryDate){
    toast(t("productReqError"));
    return;
  }
  var user = S.currentUser;
  var who = {userId: user ? user.id : null, username: user ? user.username : "", fullName: user ? user.fullName : ""};
  var nowIso = new Date().toISOString();

  if(S.db){
    S.db.doc("catalog/"+encodeURIComponent(tf.barcode)).set({
      barcode: tf.barcode, name: tf.productName.trim(),
      image: tf.image ? tf.image.url : null,
      size: tf.size.trim(), supplier: tf.supplier.trim(),
      updatedAt: nowIso
    }, {merge:true}).catch(function(){});
  }

  var doc = {
    barcode: tf.barcode, productName: tf.productName.trim(),
    image: tf.image ? tf.image.url : null,
    size: tf.size.trim(), supplier: tf.supplier.trim(),
    qty: tf.qty.toString().trim(), expiryDate: tf.expiryDate,
    company: tf.company, branch: tf.branch,
    status: "active",
    createdBy: who, createdAt: nowIso, updatedAt: nowIso,
    history: [{action:"created", qty: tf.qty.toString().trim(), expiryDate: tf.expiryDate, userId: who.userId, username: who.username, fullName: who.fullName, at: nowIso}]
  };

  saveOrQueue("expiry_items", doc, function(queued){
    toast(queued ? t("offlineSavedToast") : t("productSavedToast"));
    S.scanTarget.stage = "camera";
    S.scanTarget.barcode = "";
    renderScanner();
    startCameraScan();
  });
}

    document.getElementById("main").innerHTML = "";

    return;

  updateUserChip();
  setActiveTab();
  updateDeptSwitch();
  if(S.appMode === "accounts"){
    applyBrand("");
    renderAccounts();
  } else if(S.appMode === "merch"){
    applyBrand(S.view === "dashboard" ? (S.merchFilters.company || S.merchForm.company) : S.merchForm.company);
    if(S.view === "form") renderMerchForm(); else renderMerchDashboard();

    applyBrand(S.view === "dashboard" ? (S.trackFilters.company || S.trackContext.company) : S.trackContext.company);

  }
}

  S.authError = "";
  S.appMode = "handover";
  S.view = "form";
  render();
};
document.getElementById("deptHandoverBtn").onclick = function(){ S.appMode = "handover"; S.view = "form"; render(); };
document.getElementById("deptMerchBtn").onclick = function(){ S.appMode = "merch"; S.view = "form"; render(); };
document.getElementById("deptAccountsBtn").onclick = function(){ S.appMode = "accounts"; render(); };
document.getElementById("deptExpiryBtn").onclick = function(){ S.appMode = "expiry"; S.view = "form"; render(); };

function resolvePhotoUrls(doc){
  ["cash","inventory","cleanliness"].forEach(function(k){
    if(doc[k]){
      var clone = Object.assign({}, doc[k]);
      clone.photoUrls = (clone.photos || []).map(function(id){ return id; });
      doc[k] = clone;
    }
  });
  var out = Object.assign({}, doc);
  if(out.pending) out.pending = Object.assign({}, out.pending);
  if(out.outgoingSig) out.outgoingSigUrl = out.outgoingSig;
  if(out.incomingSig) out.incomingSigUrl = out.incomingSig;
  return out;
}

function subscribeLogs(){
  if(!S.db) return;
  S.db.collection("handovers").orderBy("createdAt","desc").limit(300).onSnapshot(function(snap){
    S.logs = snap.docs.map(function(d){
      var data = resolvePhotoUrls(Object.assign({id:d.id}, d.data() || {}));
      return data;
    });
    S.logsLoaded = true;
    if(S.view === "dashboard") renderDashboard();
  }, function(err){
    S.logsLoaded = true;
    if(S.view === "dashboard") renderDashboard();
  });
}

function boot(){
  setLang(S.lang);
  loadQueue();
  updateSyncBanner();
  window.addEventListener("online", function(){ updateSyncBanner(); trySyncQueue(); });
  window.addEventListener("offline", function(){ updateSyncBanner(); });

  var db = null, assetsApi = null;
  try{
    if(YOUR_FIREBASE_CONFIG.apiKey.indexOf("PASTE_") !== 0){
      firebase.initializeApp(YOUR_FIREBASE_CONFIG);
      db = firebase.firestore();
    }
  }catch(e){ console.error("Firebase init failed — check YOUR_FIREBASE_CONFIG in index.html", e); }

  if(YOUR_IMGBB_CONFIG.apiKey.indexOf("PASTE_") !== 0){
    assetsApi = {
      upload: function(fileOrBlob){
        var fd = new FormData();
        fd.append("image", fileOrBlob);
        var uploadUrl = "https://api.imgbb.com/1/upload?key=" + YOUR_IMGBB_CONFIG.apiKey;
        return fetch(uploadUrl, {method:"POST", body:fd}).then(function(res){
          return res.text().then(function(bodyText){
            var json = null;
            try{ json = JSON.parse(bodyText); }catch(e){}
            if(!res.ok || !json || !json.success){
              var reason = (json && json.error && json.error.message) || bodyText.slice(0,200) || ("HTTP " + res.status);
              console.error("ImgBB upload failed:", res.status, reason);
              throw new Error("ImgBB upload failed: " + reason);
            }
            var url = (json.data && (json.data.display_url || json.data.url)) || "";
            return {id: url, url: url};
          });
        }).catch(function(err){
          console.error("ImgBB upload error (network or parsing):", err);
          throw err;
        });
      }
    };
  } else {
    console.warn("ImgBB not configured — YOUR_IMGBB_CONFIG.apiKey is still the placeholder in index.html. Photo/signature upload is disabled.");
  }

  S.db = db;
  S.assets = assetsApi;
  S.canWriteAssets = !!assetsApi;

  if(db){
    subscribeLogs();
    subscribeMerchLogs();
    subscribeUsers();
    subscribeTrackedItems();
    subscribeThresholds();
    restoreSession();
    trySyncQueue();
  } else {
    S.authChecked = true;
  }

  render();
}

boot();
})();
</script>
